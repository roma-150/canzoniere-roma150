// --- Funzioni condivise di impaginazione PDF (canzone singola + canzoniere intero) ---

function buildChordLyricPairs(rawLine, semitones, chordsVisible){
  const regex = /\[([^\]]+)\]/g;
  let lastIndex = 0, match;
  const pairs = [];
  let hadChord = false;
  while((match = regex.exec(rawLine)) !== null){
    hadChord = true;
    const before = rawLine.slice(lastIndex, match.index);
    if(before) pairs.push({ chord: "", lyric: before });
    lastIndex = regex.lastIndex;
    const nextTextMatch = rawLine.slice(lastIndex).match(/^([^\[]*)/);
    const lyricAfter = nextTextMatch ? nextTextMatch[1] : "";
    const chordName = chordsVisible ? transposeChord(match[1], semitones) : "";
    pairs.push({ chord: chordName, lyric: lyricAfter || " " });
    lastIndex += lyricAfter.length;
    regex.lastIndex = lastIndex;
  }
  if(!hadChord){
    pairs.push({ chord: "", lyric: rawLine || " " });
  } else if(lastIndex < rawLine.length){
    pairs.push({ chord: "", lyric: rawLine.slice(lastIndex) });
  }
  return pairs;
}

function computeSlotWidths(doc, pairs, lyricStyle, chordFontSize, lyricFontSize){
  doc.setFont("helvetica", "bold");
  doc.setFontSize(chordFontSize);
  const chordWidths = pairs.map(p => p.chord ? doc.getTextWidth(p.chord) : 0);
  doc.setFont("helvetica", lyricStyle);
  doc.setFontSize(lyricFontSize);
  const lyricWidths = pairs.map(p => doc.getTextWidth(p.lyric));
  return pairs.map((p, i) => Math.max(lyricWidths[i], p.chord ? chordWidths[i] + 1.5 : 0));
}

function wrapPairsToRows(doc, pairs, wrapWidth, lyricStyle, chordFontSize, lyricFontSize){
  const slotWidths = computeSlotWidths(doc, pairs, lyricStyle, chordFontSize, lyricFontSize);
  const rows = [];
  let current = [], currentWidths = [], cx = 0;
  pairs.forEach((p, i) => {
    const w = slotWidths[i];
    if(cx + w > wrapWidth && current.length){
      rows.push({ pairs: current, widths: currentWidths });
      current = []; currentWidths = []; cx = 0;
    }
    current.push(p);
    currentWidths.push(w);
    cx += w;
  });
  if(current.length) rows.push({ pairs: current, widths: currentWidths });
  return rows;
}

function getRepeatedChoruses(verses){
  const chorusTexts = [];
  verses.forEach(verseText => {
    if(verseText.trim() === "" || verseText.trim() === "RIT.") return;
    let vLines = verseText.split("\n");
    const vRitMatch = vLines[0].trim().match(/^\{rit(?:\s+x(\d+))?\}$/i);
    if(!vRitMatch) return;
    chorusTexts.push(vLines.slice(1).join("\n"));
  });
  const chorusCounts = {};
  chorusTexts.forEach(t => { chorusCounts[t] = (chorusCounts[t] || 0) + 1; });
  const repeatedChoruses = [];
  chorusTexts.forEach(t => {
    if(chorusCounts[t] > 1 && !repeatedChoruses.includes(t)) repeatedChoruses.push(t);
  });
  return repeatedChoruses;
}

function buildSongRenderItems(doc, verses, wrapWidth, opts){
  const { semitones, chordsVisible, lineStep, chordFontSize, lyricFontSize } = opts;
  const repeatedChoruses = getRepeatedChoruses(verses);
  const seenChoruses = [];
  const items = [];
  verses.forEach(verseText => {
    if(verseText.trim() === "") return;
    if(verseText.trim() === "RIT."){
      items.push({ type: "ritornelloWord", height: lineStep });
      return;
    }
    let lines = verseText.split("\n");
    const ritMatch = lines[0].trim().match(/^\{rit(?:\s+x(\d+))?\}$/i);
    const instrMatch = lines[0].trim().match(/^\{strumentale\}$/i);
    const chorus = !!ritMatch;
    const instrumental = !!instrMatch;
    if(chorus || instrumental) lines = lines.slice(1);

    let ritLabel = "RIT.";
    if(chorus){
      const bodyText = lines.join("\n");
      const repeatIdx = repeatedChoruses.indexOf(bodyText);
      if(repeatIdx !== -1 && repeatedChoruses.length > 1) ritLabel = `RIT. ${repeatIdx + 1}`;
      if(seenChoruses.includes(bodyText)){
        items.push({ type: "ritShort", label: ritLabel, height: lineStep + 3 });
        return;
      }
      seenChoruses.push(bodyText);
    }

    const linePairsList = lines.map(line => buildChordLyricPairs(line, semitones, chordsVisible));
    if(chorus && linePairsList.length && linePairsList[0].length){
      linePairsList[0][0].lyric = ritLabel + " " + linePairsList[0][0].lyric;
    }
    const lyricStyle = chorus ? "bold" : "normal";
    const rows = [];
    linePairsList.forEach(pairs => {
      wrapPairsToRows(doc, pairs, wrapWidth, lyricStyle, chordFontSize, lyricFontSize).forEach(row => rows.push(row));
    });
    items.push({ type: "lines", rows, bold: chorus, height: rows.length * lineStep + 3 });
  });
  return items;
}

function drawRenderItem(doc, item, xOffset, y, opts){
  const { lineStep, rowOffset, chordFontSize, lyricFontSize } = opts;
  if(item.type === "ritornelloWord"){
    doc.setFont("helvetica", "bold");
    doc.setFontSize(11);
    doc.text("Ritornello", xOffset, y);
    return y + lineStep;
  }
  if(item.type === "ritShort"){
    doc.setFont("helvetica", "bold");
    doc.setFontSize(lyricFontSize);
    doc.text(item.label || "RIT.", xOffset, y + rowOffset);
    return y + lineStep + 3;
  }
  const lyricStyle = item.bold ? "bold" : "normal";
  item.rows.forEach(row => {
    let cx = xOffset;
    doc.setFont("helvetica", "bold");
    doc.setFontSize(chordFontSize);
    row.pairs.forEach((p, i) => {
      if(p.chord) doc.text(p.chord, cx, y);
      cx += row.widths[i];
    });
    let lx = xOffset;
    doc.setFont("helvetica", lyricStyle);
    doc.setFontSize(lyricFontSize);
    row.pairs.forEach((p, i) => {
      doc.text(p.lyric, lx, y + rowOffset);
      lx += row.widths[i];
    });
    y += lineStep;
  });
  y += 3;
  return y;
}

function layoutRenderItems(doc, buildItemsFn, opts){
  const { startY, marginX, maxWidth, pageHeight, marginBottom, columnGap, drawOpts, measureOnly, drawFn } = opts;
  const draw = drawFn || drawRenderItem;
  let y = startY;
  let pagesUsed = 1;
  const firstPageAvailable = pageHeight - marginBottom - y;
  const colWidth = (maxWidth - columnGap) / 2;
  const col2X = marginX + colWidth + columnGap;

  const singleColItems = buildItemsFn(maxWidth);
  const singleColHeight = singleColItems.reduce((s, it) => s + it.height, 0);

  let renderItems, useColumns;
  if(singleColHeight <= firstPageAvailable){
    renderItems = singleColItems;
    useColumns = false;
  } else {
    renderItems = buildItemsFn(colWidth);
    useColumns = true;
  }

  let colX = marginX;
  let colStartY = y;
  let availForPage = pageHeight - marginBottom - colStartY;

  function newPdfPage(){
    if(!measureOnly) doc.addPage();
    pagesUsed++;
    y = 20;
    colStartY = 20;
    colX = marginX;
    availForPage = pageHeight - marginBottom - colStartY;
  }

  renderItems.forEach(item => {
    if(useColumns){
      if((y - colStartY) + item.height > availForPage){
        if(colX === marginX){
          colX = col2X;
          y = colStartY;
        } else {
          newPdfPage();
        }
      }
    } else if(y + item.height > pageHeight - marginBottom){
      newPdfPage();
    }
    if(measureOnly){
      y += item.height;
    } else {
      y = draw(doc, item, colX, y, drawOpts);
    }
  });

  return { y, pagesUsed };
}

// --- Misura pagine (per indice canzoniere intero, nessun disegno reale) ---

function measureSongPages(doc, song){
  const verses = (song.testo_accordi || "").split(/\n===\n/).flatMap(b => b.split(/\n---\n/));
  const lineStep = 8;
  const chordFontSize = 9;
  const lyricFontSize = 11;
  const marginX = 15;
  const pageHeight = doc.internal.pageSize.getHeight();
  const maxWidth = doc.internal.pageSize.getWidth() - marginX * 2;

  const songOpts = { semitones: 0, chordsVisible: true, lineStep, chordFontSize, lyricFontSize };

  const { pagesUsed } = layoutRenderItems(doc, (wrapWidth) => buildSongRenderItems(doc, verses, wrapWidth, songOpts), {
    startY: 20,
    marginX,
    maxWidth,
    pageHeight,
    marginBottom: 15,
    columnGap: 8,
    drawOpts: null,
    measureOnly: true
  });

  return pagesUsed;
}

function measureNotePages(doc, entry, sectionTitle, opts){
  const { maxWidth, pageHeight, marginBottom } = opts;
  let y = 20;
  let pagesUsed = 1;

  y += sectionTitle ? 12 : 6;
  y += 10; // etichetta tipo

  doc.setFont("helvetica", "bold");
  doc.setFontSize(20);
  const titleLines = doc.splitTextToSize(entry.titolo, maxWidth);
  y += titleLines.length * 10;

  if(entry.testo && entry.testo.trim()){
    y += 4;
    doc.setFont("helvetica", "normal");
    doc.setFontSize(12);
    entry.testo.split("\n").forEach(par => {
      const lines = par === "" ? [""] : doc.splitTextToSize(par, maxWidth);
      lines.forEach(() => {
        if(y > pageHeight - marginBottom){
          pagesUsed++;
          y = 20;
        }
        y += 6.5;
      });
    });
  }

  return pagesUsed;
}

function measureAllSongPages(doc, orderedEntries){
  const results = [];
  let currentPage = 1;
  let pendingSection = null;
  const marginX = 15;
  const pageHeight = doc.internal.pageSize.getHeight();
  const maxWidth = doc.internal.pageSize.getWidth() - marginX * 2;

  orderedEntries.forEach(entry => {
    if(entry.isSection){
      results.push({ isSection: true, titolo: entry.titolo });
      pendingSection = entry.titolo;
      return;
    }
    if(entry.isNote){
      const pageCount = measureNotePages(doc, entry, pendingSection, { maxWidth, pageHeight, marginBottom: 15 });
      results.push({
        isSection: false,
        isNote: true,
        itemType: entry.itemType,
        titolo: entry.titolo,
        startPage: currentPage,
        pageCount
      });
      currentPage += pageCount;
      pendingSection = null;
      return;
    }
    const pageCount = measureSongPages(doc, entry.song);
    results.push({
      isSection: false,
      isNote: false,
      favKey: entry.favKey,
      titolo: entry.song.titolo,
      startPage: currentPage,
      pageCount
    });
    currentPage += pageCount;
    pendingSection = null;
  });
  return results;
}

// Costruisce l'elenco ordinato canzoni/sezioni di un canzoniere per l'export PDF intero.
// Sezioni senza canzoni sotto (vuote o in coda) vengono saltate.
function buildCzOrderedEntries(cz){
  const entries = [];
  let pendingSection = null;
  cz.canzoni.forEach(key => {
    if(key.startsWith(CZ_SECTION_PREFIX)){
      pendingSection = key.slice(CZ_SECTION_PREFIX.length);
      return;
    }
    const itemType = czItemTypeForKey(key);
    if(itemType){
      if(pendingSection !== null){
        entries.push({ isSection: true, titolo: pendingSection });
        pendingSection = null;
      }
      const { titolo: itemTitolo, testo: itemTesto } = parseTypedItemBody(key, itemType);
      entries.push({ isSection: false, isNote: true, itemType, titolo: itemTitolo, testo: itemTesto });
      return;
    }
    const song = findSongByFavKey(key);
    if(!song) return;
    if(pendingSection !== null){
      entries.push({ isSection: true, titolo: pendingSection });
      pendingSection = null;
    }
    entries.push({ isSection: false, isNote: false, favKey: key, song });
  });
  return entries;
}

// --- Costruzione item indice ---

const INDEX_FONT_SIZE = 11;
const INDEX_LINE_STEP = 7;
const INDEX_SECTION_FONT_SIZE = 12;
const INDEX_SECTION_LINE_STEP = 8;
const INDEX_SECTION_TOP_GAP = 3;
const INDEX_PAGENUM_RESERVE = 15;

function buildIndexRenderItems(doc, measuredEntries, wrapWidth){
  const items = [];
  measuredEntries.forEach(entry => {
    if(entry.isSection){
      doc.setFont("helvetica", "bold");
      doc.setFontSize(INDEX_SECTION_FONT_SIZE);
      const lines = doc.splitTextToSize(entry.titolo.toUpperCase(), wrapWidth);
      items.push({
        type: "indexSection",
        titolo: entry.titolo,
        lines,
        wrapWidth,
        height: lines.length * INDEX_SECTION_LINE_STEP + INDEX_SECTION_TOP_GAP
      });
      return;
    }
    doc.setFont("helvetica", "normal");
    doc.setFontSize(INDEX_FONT_SIZE);
    const availWidth = wrapWidth - INDEX_PAGENUM_RESERVE;
    const lines = doc.splitTextToSize(entry.titolo, availWidth);
    items.push({
      type: "indexSong",
      titolo: entry.titolo,
      lines,
      startPage: entry.startPage,
      wrapWidth,
      height: lines.length * INDEX_LINE_STEP
    });
  });
  return items;
}

function measureIndexPages(doc, measuredEntries){
  const marginX = 15;
  const pageHeight = doc.internal.pageSize.getHeight();
  const maxWidth = doc.internal.pageSize.getWidth() - marginX * 2;

  const { pagesUsed } = layoutRenderItems(doc, (wrapWidth) => buildIndexRenderItems(doc, measuredEntries, wrapWidth), {
    startY: 20,
    marginX,
    maxWidth,
    pageHeight,
    marginBottom: 15,
    columnGap: 8,
    drawOpts: null,
    measureOnly: true
  });

  return pagesUsed;
}

// --- Disegno copertina ---

function drawCzCoverPage(doc, cz, opts){
  const { maxWidth, pageHeight } = opts;
  const pageWidth = doc.internal.pageSize.getWidth();
  let y = pageHeight / 2 - 20;

  doc.setFont("helvetica", "bold");
  doc.setFontSize(26);
  doc.setTextColor(0, 0, 0);
  const titleLines = doc.splitTextToSize(cz.titolo, maxWidth);
  titleLines.forEach(line => {
    const w = doc.getTextWidth(line);
    doc.text(line, (pageWidth - w) / 2, y);
    y += 11;
  });

  if(cz.descrizione){
    y += 6;
    doc.setFont("helvetica", "normal");
    doc.setFontSize(13);
    doc.setTextColor(90, 90, 90);
    const descLines = doc.splitTextToSize(cz.descrizione, maxWidth - 20);
    descLines.forEach(line => {
      const w = doc.getTextWidth(line);
      doc.text(line, (pageWidth - w) / 2, y);
      y += 7;
    });
    doc.setTextColor(0, 0, 0);
  }
}

// --- Disegno riga indice (titolo + puntinato + numero pagina cliccabile) ---

function drawIndexItem(doc, item, xOffset, y){
  if(item.type === "indexSection"){
    doc.setFont("helvetica", "bold");
    doc.setFontSize(INDEX_SECTION_FONT_SIZE);
    doc.setTextColor(0, 0, 0);
    let ty = y + INDEX_SECTION_TOP_GAP;
    item.lines.forEach(line => {
      doc.text(line, xOffset, ty);
      ty += INDEX_SECTION_LINE_STEP;
    });
    return y + item.height;
  }

  doc.setFont("helvetica", "normal");
  doc.setFontSize(INDEX_FONT_SIZE);
  doc.setTextColor(0, 0, 0);
  const rightEdge = xOffset + item.wrapWidth;
  let ty = y;
  item.lines.forEach((line, i) => {
    doc.text(line, xOffset, ty);
    if(i === item.lines.length - 1){
      const lineWidth = doc.getTextWidth(line);
      const pageNumStr = String(item.startPage);
      const pageNumWidth = doc.getTextWidth(pageNumStr);
      const leaderStartX = xOffset + lineWidth + 2;
      const leaderEndX = rightEdge - pageNumWidth - 2;
      if(leaderEndX > leaderStartX){
        doc.setLineDashPattern([0.5, 1.2], 0);
        doc.setDrawColor(150, 150, 150);
        doc.line(leaderStartX, ty - 1.2, leaderEndX, ty - 1.2);
        doc.setLineDashPattern([], 0);
        doc.setDrawColor(0, 0, 0);
      }
      doc.text(pageNumStr, rightEdge - pageNumWidth, ty);
      doc.link(xOffset, ty - INDEX_LINE_STEP + 2, item.wrapWidth, INDEX_LINE_STEP, { pageNumber: item.startPage });
    }
    ty += INDEX_LINE_STEP;
  });
  return y + item.height;
}

// --- Disegno pagina di una canzone dentro il canzoniere intero ---

// --- Export PDF canzoniere intero ---

async function exportCanzoniereePdf(cz){
  if(!window.jspdf){
    alert("La libreria per generare il PDF non è disponibile. Controlla la connessione e riprova.");
    return;
  }
  const orderedEntries = buildCzOrderedEntries(cz);
  if(orderedEntries.length === 0){
    alert("Questo canzoniere non contiene ancora canzoni da stampare.");
    return;
  }

  const { jsPDF } = window.jspdf;

  const measureDoc = new jsPDF();
  const measuredSongs = measureAllSongPages(measureDoc, orderedEntries);
  const indexPageCount = measureIndexPages(measureDoc, measuredSongs);
  const pageOffset = 1 + indexPageCount;
  const finalIndexEntries = measuredSongs.map(e => e.isSection ? e : Object.assign({}, e, { startPage: e.startPage + pageOffset }));

  const doc = new jsPDF();
  const marginX = 15;
  const marginBottom = 15;
  const pageHeight = doc.internal.pageSize.getHeight();
  const maxWidth = doc.internal.pageSize.getWidth() - marginX * 2;

  drawCzCoverPage(doc, cz, { maxWidth, pageHeight });
  doc.addPage();

  layoutRenderItems(doc, (wrapWidth) => buildIndexRenderItems(doc, finalIndexEntries, wrapWidth), {
    startY: 20,
    marginX,
    maxWidth,
    pageHeight,
    marginBottom,
    columnGap: 8,
    drawOpts: null,
    drawFn: drawIndexItem
  });

  doc.addPage();
  let pendingSection = null;
  let firstSongDrawn = false;
  orderedEntries.forEach(entry => {
    if(entry.isSection){
      pendingSection = entry.titolo;
      return;
    }
    if(firstSongDrawn) doc.addPage();
    if(entry.isNote){
      drawCzNotePage(doc, entry, pendingSection, { marginX, maxWidth, pageHeight, marginBottom });
    } else {
      drawCzSongPage(doc, entry.song, pendingSection, { marginX, maxWidth, pageHeight, marginBottom });
    }
    pendingSection = null;
    firstSongDrawn = true;
  });

  const totalPages = doc.internal.getNumberOfPages();
  for(let p = 1; p <= totalPages; p++){
    doc.setPage(p);
    const part1 = "Generato automaticamente con l'app ";
    const part2 = "Canzoniere di Gruppo - Roma 150";
    doc.setFontSize(8);
    doc.setTextColor(140, 140, 140);
    doc.setFont("helvetica", "normal");
    const w1 = doc.getTextWidth(part1);
    doc.setFont("helvetica", "italic");
    const w2 = doc.getTextWidth(part2);
    const totalW = w1 + w2;
    const startX = (doc.internal.pageSize.getWidth() - totalW) / 2;
    const footY = pageHeight - 8;
    doc.setFont("helvetica", "normal");
    doc.text(part1, startX, footY);
    doc.setFont("helvetica", "italic");
    doc.text(part2, startX + w1, footY);
    doc.setTextColor(0, 0, 0);
  }

  const filename = (cz.titolo || "canzoniere").replace(/[\\/:*?"<>|]/g, "") + ".pdf";
  const isMobile = isIPhoneDevice || /Android/i.test(navigator.userAgent);
  if(isMobile && navigator.canShare && navigator.share){
    try {
      const blob = doc.output("blob");
      const file = new File([blob], filename, { type: "application/pdf" });
      if(navigator.canShare({ files: [file] })){
        await navigator.share({ files: [file], title: cz.titolo });
        return;
      }
    } catch(err){
      // se la condivisione fallisce/viene annullata, scarica normalmente
    }
  }
  doc.save(filename);
}

          topNextBtn.innerHTML = ICONS.chevronRight(28);
          topNextBtn.addEventListener("click", () => {
            const nextSong = findSongByFavKey(nextKey);
            if(nextSong) showDetail(SONGS.indexOf(nextSong));
          });
          navIconsRow.appendChild(topNextBtn);
        }
        detailNavBtns.appendChild(navIconsRow);

        const navPageLabel = document.createElement("div");
        navPageLabel.className = "detail-nav-page";
        navPageLabel.textContent = `Pag. ${czIdx + 1}/${currentCzQueue.length}`;
        detailNavBtns.appendChild(navPageLabel);

        const navPageLabelBottom = document.createElement("div");
        navPageLabelBottom.className = "detail-nav-page-bottom";
        navPageLabelBottom.textContent = `Pag. ${czIdx + 1}/${currentCzQueue.length}`;
        card2.appendChild(navPageLabelBottom);
      }
      if(prevKey || nextKey){
        const navRow = document.createElement("div");
        navRow.style.display = "flex";
        navRow.style.gap = "8px";
        navRow.style.marginTop = "8px";
        if(prevKey){
          const prevBtn = document.createElement("button");
          prevBtn.className = "pill-btn active";
          prevBtn.style.flex = "1";
          prevBtn.style.justifyContent = "center";
          prevBtn.innerHTML = `${ICONS.chevronLeft(16)} Precedente`;
          prevBtn.addEventListener("click", () => {
            const prevSong = findSongByFavKey(prevKey);
            if(prevSong) showDetail(SONGS.indexOf(prevSong));
          });
          navRow.appendChild(prevBtn);
        }
        if(nextKey){
          const nextBtn = document.createElement("button");
          nextBtn.className = "pill-btn active";
          nextBtn.style.flex = "1";
          nextBtn.style.justifyContent = "center";
          nextBtn.innerHTML = `Successiva ${ICONS.chevronRight(16)}`;
          nextBtn.addEventListener("click", () => {
            const nextSong = findSongByFavKey(nextKey);
            if(nextSong) showDetail(SONGS.indexOf(nextSong));
          });
          navRow.appendChild(nextBtn);
        }
        pendingNavRow = navRow;
      }
    }
  }

  const backBtn = document.createElement("button");
  backBtn.className = "pill-btn active";
  backBtn.style.width = "100%";
  backBtn.style.justifyContent = "center";
  backBtn.style.marginTop = "4px";
  backBtn.innerHTML = `${ICONS.arrowBack(16)}${returnToViewLabel}`;
  backBtn.addEventListener("click", goBack);
  if(pendingNavRow) content.appendChild(pendingNavRow);
  content.appendChild(backBtn);

  function render(){
    body.innerHTML = "";
    const blocks = song.testo_accordi.split(/\n===\n/);
    blocks.forEach(b => {
      b.split(/\n---\n/).forEach(sub => body.appendChild(renderBlock(sub, semitones)));
    });
    document.getElementById("currentKey").textContent = song.tonalita ? transposeChord(song.tonalita, semitones) : "—";
  }

  document.getElementById("up").addEventListener("click", () => { semitones++; render(); });
  document.getElementById("down").addEventListener("click", () => { semitones--; render(); });

  const SCROLL_SPEEDS = [
    { step: 1, interval: 140 }, // livello 1
    { step: 1, interval: 115 }, // livello 2
    { step: 1, interval: 95 },  // livello 3
    { step: 1, interval: 75 },  // livello 4
    { step: 1, interval: 55 },  // livello 5 (predefinito)
    { step: 1, interval: 42 },  // livello 6
    { step: 1, interval: 32 },  // livello 7
    { step: 2, interval: 30 },  // livello 8
    { step: 2, interval: 22 },  // livello 9
    { step: 2, interval: 16 }   // livello 10
  ];
  let scrollLevel = 5;
  let scrolling = false;
  let scrollInterval = null;
  const scrollPlayPauseBtn = document.getElementById("scrollPlayPause");
  const scrollMinusBtn = document.getElementById("scrollMinus");
  const scrollPlusBtn = document.getElementById("scrollPlus");
  const scrollLabel = document.getElementById("scrollLabel");

  const scrollFloat = document.createElement("div");
  scrollFloat.className = "scroll-float";
  scrollFloat.innerHTML = `
    <button id="scrollFloatMinus" aria-label="Rallenta">–</button>
    <button id="scrollFloatPlayPause" aria-label="Avvia scorrimento">${ICONS.play(14)}</button>
    <button id="scrollFloatPlus" aria-label="Accelera">+</button>
    <span class="scroll-float-label" id="scrollFloatLabel">Velocità 5</span>
  `;
  document.querySelector(".phone").appendChild(scrollFloat);
  const scrollFloatPlayPauseBtn = scrollFloat.querySelector("#scrollFloatPlayPause");
  const scrollFloatMinusBtn = scrollFloat.querySelector("#scrollFloatMinus");
  const scrollFloatPlusBtn = scrollFloat.querySelector("#scrollFloatPlus");
  const scrollFloatLabel = scrollFloat.querySelector("#scrollFloatLabel");

  function updateScrollUI(){
    scrollLabel.textContent = "Scorri (" + scrollLevel + ")";
    scrollFloatLabel.textContent = "Velocità " + scrollLevel;
  }

  function stopScroll(){
    scrolling = false;
    scrollPlayPauseBtn.innerHTML = ICONS.play(14);
    scrollFloatPlayPauseBtn.innerHTML = ICONS.play(14);
    scrollFloat.classList.remove("visible");
    clearInterval(scrollInterval);
    activeScrollInterval = null;
  }

  function applyScrollInterval(){
    if(!scrolling) return;
    const speed = SCROLL_SPEEDS[scrollLevel - 1];
    clearInterval(scrollInterval);
    scrollInterval = setInterval(() => {
      window.scrollBy({ top: speed.step, behavior: "auto" });
      if(window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 2){
        stopScroll();
      }
    }, speed.interval);
    activeScrollInterval = scrollInterval;
  }

  function startScroll(){
    scrolling = true;
    scrollPlayPauseBtn.innerHTML = ICONS.pause(14);
    scrollFloatPlayPauseBtn.innerHTML = ICONS.pause(14);
    scrollFloat.classList.add("visible");
    applyScrollInterval();
  }

  function toggleScroll(){
    if(scrolling) stopScroll(); else startScroll();
  }
  function decreaseScrollLevel(){
    scrollLevel = Math.max(1, scrollLevel - 1);
    updateScrollUI();
    applyScrollInterval();
  }
  function increaseScrollLevel(){
    scrollLevel = Math.min(10, scrollLevel + 1);
    updateScrollUI();
    applyScrollInterval();
  }

  scrollPlayPauseBtn.addEventListener("click", toggleScroll);
  scrollMinusBtn.addEventListener("click", decreaseScrollLevel);
  scrollPlusBtn.addEventListener("click", increaseScrollLevel);
  scrollFloatPlayPauseBtn.addEventListener("click", toggleScroll);
  scrollFloatMinusBtn.addEventListener("click", decreaseScrollLevel);
  scrollFloatPlusBtn.addEventListener("click", increaseScrollLevel);
  updateScrollUI();

  render();
  footer.textContent = song.tonalita ? ("Trasposizione automatica · tonalità originale " + song.tonalita) : "Canzone senza accordi";
}

if(/Android/i.test(navigator.userAgent)){
  document.body.classList.add("is-android");
}

const isIPhoneDevice = /iPhone|iPod/i.test(navigator.userAgent);
let wasOverlayVisible = false;
let lockSuggestTimeout = null;

function showLockSuggestToast(){
  const toast = document.getElementById("lockSuggestToast");
  if(!toast) return;
  toast.classList.add("visible");
  clearTimeout(lockSuggestTimeout);
  lockSuggestTimeout = setTimeout(() => toast.classList.remove("visible"), 6000);
}

function updateOrientationOverlay(){
  const overlay = document.getElementById("orientationOverlay");
  if(!overlay) return;
  const isLandscape = window.matchMedia("(orientation: landscape)").matches;
  const isOverlayVisible = isIPhoneDevice && isLandscape;
  overlay.classList.toggle("visible", isOverlayVisible);
  if(wasOverlayVisible && !isOverlayVisible){
    showLockSuggestToast();
  }
  wasOverlayVisible = isOverlayVisible;
}
if(isIPhoneDevice){
  window.addEventListener("resize", updateOrientationOverlay);
  window.addEventListener("orientationchange", updateOrientationOverlay);
  updateOrientationOverlay();
  const lockSuggestClose = document.getElementById("lockSuggestClose");
  if(lockSuggestClose){
    lockSuggestClose.addEventListener("click", () => {
      document.getElementById("lockSuggestToast").classList.remove("visible");
      clearTimeout(lockSuggestTimeout);
    });
  }
}

document.querySelector(".phone").classList.toggle("dark-bg", detailDarkMode);
renderHeaderBrand();
setActiveTab("canzoni");
function getGreeting(){
  const h = new Date().getHours();
  if(h < 12) return "Buongiorno";
  if(h < 18) return "Buon pomeriggio";
  return "Buonasera";
}
function showSplashScreen(onHide){
  const splash = document.getElementById("splashScreen");
  const greetingEl = document.getElementById("splashGreeting");
  if(!splash || !greetingEl){ if(onHide) onHide(); return; }
  greetingEl.textContent = getGreeting() + (USERNAME ? ", " + USERNAME : "") + "!";
  setTimeout(() => {
    splash.classList.add("hidden");
    setTimeout(() => { splash.remove(); if(onHide) onHide(); }, 400);
  }, 2000);
}

checkForUpdate();
logEvento("apertura_app");
flushEventQueue();
showSplashScreen(() => { if(!USERNAME) showUsernamePrompt(); });

content.addEventListener("pointerdown", (e) => {
  if(e.pointerType !== "touch") return;
  swipePointerId = e.pointerId;
  swipeStartX = e.clientX;
  swipeStartY = e.clientY;
});
content.addEventListener("pointercancel", (e) => {
  if(e.pointerId === swipePointerId) swipePointerId = null;
});
content.addEventListener("pointerup", (e) => {
  if(e.pointerId !== swipePointerId) return;
  swipePointerId = null;
  if(!inDetailView || !currentCzQueue || !currentDetailSong) return;
  const dx = e.clientX - swipeStartX;
  const dy = e.clientY - swipeStartY;
  if(Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  const czIdx = currentCzQueue.indexOf(favKey(currentDetailSong));
  if(czIdx === -1) return;
  if(dx < 0){
    if(czIdx < currentCzQueue.length - 1){
      const nextSong = findSongByFavKey(currentCzQueue[czIdx + 1]);
      if(nextSong) showDetail(SONGS.indexOf(nextSong));
    }
  } else {
    if(czIdx > 0){
      const prevSong = findSongByFavKey(currentCzQueue[czIdx - 1]);
      if(prevSong) showDetail(SONGS.indexOf(prevSong));
    }
  }
});

fetch("songs.json")
  .then(r => r.json())
  .then(data => { SONGS = data; buildLuogoCategories(); buildGenereCategories(); buildAutoreCategories(); buildAnnataCategories(); showList(); })
  .catch(() => {
    content.innerHTML = '<div class="card"><div class="empty">Impossibile caricare le canzoni. Controlla la connessione e riprova.</div></div>';
  });

fetch("canzonieri_predefiniti.json")
  .then(r => r.json())
  .then(data => {
    PRESET_CANZONIERI = Array.isArray(data) ? data : [];
    if(currentTab === "canzonieri") renderCanzonieri();
  })
  .catch(() => { PRESET_CANZONIERI = []; });

if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(() => {});
  });
}
