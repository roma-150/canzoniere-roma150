<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Canzoniere Roma 150</title>
<meta name="theme-color" content="#3B2065">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-ios.jpg">
<link rel="icon" type="image/jpeg" href="icons/icon-ios.jpg">
<style>
  :root{
    --text-scale:1;
    --purple:#381E60;
    --gold:#D89B00;
    --green:#00AE04;
    --bg:#F8F9FC;
    --white:#FFFFFF;
    --ink:#1C1C1E;
    --ink-soft:#6E6E73;
    --neutral:#F0F0F3;
    --border:#E5E5EA;
    --lilac:#F1EDF7;
    --green-tint-a:#EAF9EA;
    --green-tint-b:#F5FCF5;
    --amber:#A9720B;
    --amber-tint:#FBF2DC;
    --phone-max-width:clamp(430px, 100vw, 900px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    background:var(--purple);
    min-height:100vh;
  }
  .phone{ width:100%; max-width:var(--phone-max-width); min-height:100vh; display:flex; flex-direction:column; padding-bottom:100px; background:var(--bg); }

  .bottom-nav{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom) * 0.6);
    width:calc(100% - 24px); max-width:calc(var(--phone-max-width) - 24px);
    display:flex;
    background:rgba(255,255,255,0.55);
    -webkit-backdrop-filter:blur(24px) saturate(180%) contrast(115%);
    backdrop-filter:blur(24px) saturate(180%) contrast(115%);
    border:1px solid rgba(255,255,255,0.7);
    border-bottom-color:rgba(255,255,255,0.25);
    border-radius:28px;
    padding:6px 10px;
    box-shadow:0 8px 32px rgba(56,30,96,0.20), inset 0 1px 0 rgba(255,255,255,0.65), inset 0 -1px 0 rgba(0,0,0,0.05);
    z-index:20;
    transition:opacity 0.28s cubic-bezier(0.34, 1.4, 0.64, 1), transform 0.28s cubic-bezier(0.34, 1.4, 0.64, 1);
  }
  .bottom-nav::before{
    content:"";
    position:absolute; inset:0;
    z-index:-1;
    border-radius:28px;
    background:linear-gradient(180deg, rgba(255,255,255,0.35), rgba(255,255,255,0) 55%);
    pointer-events:none;
  }
  .bottom-nav.hidden{
    opacity:0;
    pointer-events:none;
    transform:translateX(-50%) translateY(24px) scale(0.92);
    transition:opacity 0.32s ease-out, transform 0.32s ease-out;
  }
  body.is-android .bottom-nav{
    bottom:calc(env(safe-area-inset-bottom) * 0.6 + 10px);
  }
  .nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center;
    background:none; border:none; cursor:pointer; color:#8E8E93;
    padding:2px 0;
  }
  .nav-pill{
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:6px 10px 5px; border-radius:16px;
    transition:background 0.25s ease, box-shadow 0.25s ease, transform 0.12s ease-out;
    transform-origin:center bottom;
  }
  .nav-item i{ font-size:21px; }
  .nav-item span{ font-size:10.5px; font-weight:700; }
  .nav-item.active{ color:var(--purple); }
  .nav-item.active .nav-pill{
    background:rgba(56,30,96,0.14);
    box-shadow:inset 0 1px 1px rgba(255,255,255,0.6), 0 1px 3px rgba(56,30,96,0.15);
  }
  .bottom-nav.dragging .nav-item.active{ color:#8E8E93; }
  .bottom-nav.dragging .nav-item.active .nav-pill{ background:transparent; box-shadow:none; }
  .nav-item.drag-preview{ color:var(--purple); }
  .nav-item.drag-preview .nav-pill{
    background:rgba(56,30,96,0.14);
    box-shadow:inset 0 1px 1px rgba(255,255,255,0.6), 0 1px 3px rgba(56,30,96,0.15);
  }

  .phone.dark-bg .bottom-nav{
    background:rgba(28,28,30,0.55);
    border-color:rgba(255,255,255,0.14);
    border-bottom-color:rgba(255,255,255,0.05);
    box-shadow:0 8px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1), inset 0 -1px 0 rgba(0,0,0,0.2);
  }
  .phone.dark-bg .bottom-nav::before{
    background:linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0) 55%);
  }
  .phone.dark-bg .nav-item{ color:#8E8E93; }
  .phone.dark-bg .nav-item.active{ color:#F2F2F7; }
  .phone.dark-bg .nav-item.active .nav-pill{
    background:rgba(255,255,255,0.16);
    box-shadow:inset 0 1px 1px rgba(255,255,255,0.2), 0 1px 3px rgba(0,0,0,0.3);
  }
  .phone.dark-bg .bottom-nav.dragging .nav-item.active{ color:#8E8E93; }
  .phone.dark-bg .bottom-nav.dragging .nav-item.active .nav-pill{ background:transparent; box-shadow:none; }
  .phone.dark-bg .nav-item.drag-preview{ color:#F2F2F7; }
  .phone.dark-bg .nav-item.drag-preview .nav-pill{
    background:rgba(255,255,255,0.16);
    box-shadow:inset 0 1px 1px rgba(255,255,255,0.2), 0 1px 3px rgba(0,0,0,0.3);
  }

  .placeholder-card{ text-align:center; padding:36px 20px; }

  .back-to-top{
    position:fixed; right:max(18px, calc((100vw - var(--phone-max-width)) / 2 + 18px)); bottom:calc(78px + env(safe-area-inset-bottom));
    width:46px; height:46px; border-radius:50%; border:none;
    background:var(--purple); color:var(--white);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 18px rgba(30,20,50,0.22);
    cursor:pointer; z-index:19;
    opacity:0; pointer-events:none; transform:translateY(8px);
    transition:opacity 0.15s ease, transform 0.15s ease;
  }
  .back-to-top.visible{ opacity:1; pointer-events:auto; transform:translateY(0); }
  .placeholder-icon{
    width:56px; height:56px; border-radius:16px; margin:0 auto 14px;
    background:var(--neutral); color:var(--purple); font-size:26px;
    display:flex; align-items:center; justify-content:center;
  }
  .placeholder-card h2{ font-size:17px; font-weight:800; margin:0 0 6px; }
  .placeholder-card p{ font-size:13.5px; color:var(--ink-soft); line-height:1.5; margin:0; }

  .app-header{
    background:var(--purple);
    color:var(--white);
    padding:12px 20px 13px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:relative;
  }
  .app-header.sticky{
    position:sticky;
    top:0;
    z-index:15;
  }
  .header-spacer{ width:44px; flex-shrink:0; }
  .header-version{
    font-size:11px; font-weight:600; letter-spacing:0.02em;
    color:rgba(255,255,255,0.6); flex-shrink:0;
  }
  .header-update-btn{
    width:44px; height:44px; border-radius:14px; flex-shrink:0;
    background:rgba(255,255,255,0.14); border:none; color:var(--white);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:opacity 0.2s ease;
  }
  .header-update-btn:active{ background:rgba(255,255,255,0.24); }
  .header-update-btn.offline{ opacity:0.35; pointer-events:none; }
  .header-update-btn.updating svg{ animation:spin 0.8s linear infinite; }
  .header-update-btn.has-update::after{
    content:""; position:absolute; top:6px; right:6px;
    width:9px; height:9px; border-radius:50%;
    background:#E4573D; border:1.5px solid var(--purple);
  }
  .header-update-btn{ position:relative; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .brand-text-center{
    position:absolute; left:calc(50% - 23px); top:50%;
    transform:translate(-50%, -50%);
    text-align:center; white-space:nowrap; pointer-events:none;
  }
  .brand-text-center .name{ font-size:17px; font-weight:800; letter-spacing:0.01em; }
  .brand-text-center .sub{ font-size:12px; color:rgba(255,255,255,0.65); font-weight:500; margin-top:1px; }
  .header-back-btn{
    width:44px; height:44px; border-radius:14px;
    background:rgba(255,255,255,0.14);
    border:none; color:var(--white); font-size:20px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0;
  }
  .header-back-btn:active{ background:rgba(255,255,255,0.24); }
  .header-actions{ display:flex; align-items:center; gap:8px; flex-shrink:0; }

  .content{ padding:18px 16px 0; flex:1; }
  .phone.dark-bg{ background:#131315; }
  .phone.dark-bg footer{ color:#9A9AA0; }

  .card{
    background:var(--white);
    border-radius:24px;
    padding:22px 20px;
    box-shadow:0 4px 20px rgba(30,20,50,0.06);
    margin-bottom:16px;
  }

  /* elenco */
  .back-link{
    display:inline-flex; align-items:center; gap:4px;
    color:var(--purple); font-weight:700; font-size:14px;
    background:none; border:none; padding:0 0 14px; cursor:pointer;
  }
  .list-title{ font-size:19px; font-weight:800; margin:0 0 14px; }
  .list-title-count{ font-size:13px; font-weight:600; color:var(--ink-soft); }
  .cat-group-title{ cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .cat-group-chevron{ display:flex; align-items:center; flex-shrink:0; color:var(--ink-soft); transition:transform 0.2s ease; }
  .cat-group-title.open .cat-group-chevron{ transform:rotate(90deg); }
  .cat-group-rows{ max-height:0; overflow:hidden; transition:max-height 0.3s ease; }
  .cat-group-rows.open{ max-height:3000px; }

  .search-filter-row{
    display:flex; align-items:center; margin-bottom:12px;
    position:sticky; top:0; z-index:5;
  }
  .search-box{
    display:flex; align-items:center; gap:8px; flex:1; min-width:0;
    background:var(--neutral); border-radius:12px; padding:10px 14px;
    transition:width 0.32s cubic-bezier(0.4,0,0.2,1);
  }
  .search-filter-row.stuck{ box-shadow:0 6px 14px rgba(28,28,30,0.10); border-radius:12px; }
  .search-box i{ color:var(--ink-soft); font-size:17px; }
  .search-box input{
    border:none; background:transparent; flex:1; font-size:14.5px;
    color:var(--ink); outline:none; font-family:inherit;
  }
  .search-box input::placeholder{ color:var(--ink-soft); }
  .search-clear-btn{
    display:none; align-items:center; justify-content:center;
    width:20px; height:20px; border-radius:50%; border:none; flex-shrink:0;
    background:var(--border); color:var(--ink-soft); cursor:pointer; padding:0;
  }
  .search-clear-btn.visible{ display:flex; }

  .filter-toggle-btn{
    flex:0 0 38px; width:38px; height:38px; border-radius:12px; border:none;
    margin-left:8px; padding:0; min-width:0; background:var(--neutral); color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    overflow:hidden;
    transition:flex-basis 0.32s cubic-bezier(0.4,0,0.2,1), width 0.32s cubic-bezier(0.4,0,0.2,1), margin-left 0.32s cubic-bezier(0.4,0,0.2,1), opacity 0.22s ease;
  }
  .filter-toggle-btn.active{ background:var(--purple); color:var(--white); }
  .search-filter-row.collapsed .filter-toggle-btn{
    flex-basis:0; width:0; margin-left:0; opacity:0; pointer-events:none;
  }

  .filter-panel{ max-height:0; overflow:hidden; transition:max-height 0.28s ease; }
  .filter-panel.open{ max-height:320px; }
  .filter-row{ margin-bottom:10px; padding-top:2px; }
  .filter-row .filter-label{ font-size:11px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:6px; }
  .filter-chips{ display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
  .filter-chips::-webkit-scrollbar{ display:none; }
  .filter-chip{
    flex-shrink:0; border:none; border-radius:999px; padding:7px 14px;
    font-size:12.5px; font-weight:700; background:var(--neutral); color:var(--ink-soft);
    cursor:pointer; white-space:nowrap;
    display:inline-flex; align-items:center; gap:5px;
  }
  .filter-chip.active{ background:var(--purple); color:var(--white); }

  .sort-row{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .segmented{
    display:flex; background:var(--neutral); border-radius:12px; padding:3px; flex:1;
  }
  .segmented button{
    flex:1; border:none; background:transparent; border-radius:9px;
    padding:8px 10px; font-size:13.5px; font-weight:700; color:var(--ink-soft);
    cursor:pointer;
  }
  .segmented button.active{ background:var(--purple); color:var(--white); box-shadow:0 1px 4px rgba(0,0,0,0.08); }
  .dir-btn{
    width:38px; height:38px; border-radius:12px; border:none;
    background:var(--neutral); color:var(--ink-soft); font-size:17px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .dir-btn:active{ background:var(--border); }

  .group-divider{
    font-size:12px; font-weight:800; color:var(--purple);
    background:var(--lilac); padding:6px 20px; margin:16px -20px 2px;
    letter-spacing:0.04em; text-transform:uppercase;
  }
  .group-divider:first-of-type{ margin-top:10px; }
  .song-row{
    display:flex; align-items:center; justify-content:space-between; gap:6px;
    padding:14px 4px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
  }
  .song-row:last-child{ border-bottom:none; }
  .song-row .row-title{ font-size:16px; font-weight:700; color:var(--ink); }
  .song-row .row-meta{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .song-row i{ color:var(--ink-soft); font-size:18px; }
  .row-end{ display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .fav-star{
    border:none; background:none; padding:6px; margin:-6px;
    color:#D8D6DE; display:flex; align-items:center; cursor:pointer; flex-shrink:0;
  }
  .fav-star.active{ color:var(--gold); }
  .key-badge{
    display:flex; align-items:center; gap:3px; flex-shrink:0;
    font-size:11.5px; font-weight:800; color:var(--gold);
    background:rgba(216,155,0,0.12); border-radius:8px; padding:4px 7px 4px 6px;
  }

  /* dettaglio */
  .card-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .song-title{ font-size:23px; font-weight:800; color:var(--ink); line-height:1.25; margin:0; }
  .song-meta{ font-size:13px; color:var(--ink-soft); font-weight:600; margin-top:4px; }
  .song-meta.sede-row{ margin-top:2px; }

  .pill-btn{
    display:flex; align-items:center; gap:6px;
    background:var(--purple); color:var(--white); border:none;
    font-size:13.5px; font-weight:700; padding:10px 16px; border-radius:999px;
    cursor:pointer; white-space:nowrap; flex-shrink:0;
  }
  .pill-btn.active{ background:var(--purple); }
  .pill-btn i{ font-size:16px; }

  .tile-row{ display:flex; gap:8px; margin-top:18px; }
  .mini-tile{
    flex:1; min-width:0; border-radius:18px;
    padding:12px 8px 10px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
  }
  .mini-tile .label{ font-size:11px; font-weight:700; }

  .key-tile{ background:var(--neutral); }
  .key-tile .label{ color:var(--ink-soft); }
  .key-value{ font-size:20px; font-weight:800; color:var(--purple); line-height:1; margin-top:6px; }
  .key-controls{ display:flex; align-items:center; justify-content:center; gap:10px; margin-top:4px; }
  .key-controls button{
    width:20px; height:20px; border-radius:50%; border:1.5px solid var(--purple);
    background:var(--white); color:var(--purple); font-size:12px; font-weight:700;
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .key-controls button:active{ background:var(--neutral); }

  .fontsize-tile{ background:var(--neutral); cursor:pointer; user-select:none; }
  .fontsize-tile .label{ color:var(--ink-soft); }
  .fontsize-tile .a-sample{ font-size:20px; font-weight:800; color:var(--purple); line-height:1; margin-top:6px; }
  .fontsize-tile .state-name{ font-size:10.5px; font-weight:700; color:var(--ink-soft); margin-top:4px; }

  .chords-hidden .chord{ display:none; }
  .chordtoggle-tile{ background:var(--neutral); cursor:pointer; user-select:none; }
  .chordtoggle-tile .label{ color:var(--ink-soft); }
  .chordtoggle-tile .chordtoggle-icon{ margin-top:6px; display:flex; align-items:center; justify-content:center; height:20px; color:var(--purple); }
  .chordtoggle-tile .state-name{ font-size:10.5px; font-weight:700; color:var(--ink-soft); margin-top:4px; }
  .scroll-tile{ background:var(--neutral); cursor:pointer; user-select:none; }
  .scroll-tile .label{ color:var(--ink-soft); }
  .scroll-tile .scroll-icon{ margin-top:6px; display:flex; align-items:center; justify-content:center; height:20px; color:var(--purple); }
  .scroll-tile .state-name{ font-size:10.5px; font-weight:700; color:var(--ink-soft); margin-top:4px; min-height:13px; }

  .verse{ margin-bottom:22px; }
  .verse:last-child{ margin-bottom:0; }
  .verse.chorus{ background:var(--amber-tint); border-radius:16px; padding:14px 16px 12px; }
  .refrain-tag{
    display:inline-block; font-size:11px; font-weight:800; letter-spacing:0.04em;
    text-transform:uppercase; color:var(--white); background:var(--amber);
    border-radius:999px; padding:4px 10px; margin-bottom:8px;
  }
  .line{ display:flex; flex-wrap:wrap; align-items:flex-start; }
  .pair{ display:inline-flex; flex-direction:column; align-items:flex-start; max-width:100%; margin-right:0; }
  .pair.pair-space{ margin-right:3px; }
  .chord{ display:block; height:17px; line-height:17px; font-size:calc(13px * var(--text-scale)); font-weight:800; color:var(--purple); white-space:nowrap; }
  .verse.chorus .chord{ color:var(--amber); }
  .verse.instrumental{ background:var(--green-tint-a); border-radius:16px; padding:14px 16px 12px; }
  .verse.instrumental .refrain-tag{ background:var(--green); }
  .verse.instrumental .chord{ color:var(--green); }
  .verse.instrumental .lyric{ display:none; }
  .lyric{ display:block; white-space:pre-wrap; overflow-wrap:break-word; font-size:calc(16.5px * var(--text-scale)); line-height:1.55; color:var(--ink); }

  .header-dark-btn{
    width:44px; height:44px; border-radius:14px; flex-shrink:0;
    background:rgba(255,255,255,0.14); border:none; color:var(--white);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .header-dark-btn:active{ background:rgba(255,255,255,0.24); }

  .phone.dark-bg .card{ background:#1C1C1E; }
  .phone.dark-bg .song-title{ color:#F2F2F7; }
  .phone.dark-bg .song-meta{ color:#9A9AA0; }
  .phone.dark-bg .lyric{ color:#F2F2F7; }
  .phone.dark-bg .verse.chorus{ background:#3A2E12; }
  .phone.dark-bg .verse.instrumental{ background:#123318; }
  .phone.dark-bg .empty{ color:#9A9AA0; }

  .phone.dark-bg .key-tile,
  .phone.dark-bg .fontsize-tile,
  .phone.dark-bg .scroll-tile,
  .phone.dark-bg .chordtoggle-tile{ background:var(--purple); }
  .phone.dark-bg .key-tile .label,
  .phone.dark-bg .fontsize-tile .label,
  .phone.dark-bg .scroll-tile .label,
  .phone.dark-bg .chordtoggle-tile .label{ color:rgba(255,255,255,0.75); }
  .phone.dark-bg .key-value{ color:var(--white); }
  .phone.dark-bg .key-controls button{ border-color:var(--white); color:var(--white); background:transparent; }
  .phone.dark-bg .key-controls button:active{ background:rgba(255,255,255,0.15); }
  .phone.dark-bg .fontsize-tile .a-sample,
  .phone.dark-bg .scroll-tile .scroll-icon,
  .phone.dark-bg .chordtoggle-tile .chordtoggle-icon{ color:var(--white); }
  .phone.dark-bg .fontsize-tile .state-name,
  .phone.dark-bg .scroll-tile .state-name,
  .phone.dark-bg .chordtoggle-tile .state-name{ color:rgba(255,255,255,0.75); }

  .phone.dark-bg .chord{ color:var(--white); }

  .phone.dark-bg .list-title,
  .phone.dark-bg .back-link{ color:#F2F2F7; }
  .phone.dark-bg .list-title-count{ color:#9A9AA0; }
  .phone.dark-bg .search-box{ background:#2C2C2E; }
  .phone.dark-bg .search-box input{ color:#F2F2F7; }
  .phone.dark-bg .search-box input::placeholder{ color:#8E8E93; }
  .phone.dark-bg .search-box svg{ color:#FFFFFF; }
  .phone.dark-bg .search-clear-btn{ background:#48484A; }
  .phone.dark-bg .filter-toggle-btn{ background:#2C2C2E; }
  .phone.dark-bg .filter-toggle-btn svg{ color:#FFFFFF; }
  .phone.dark-bg .filter-toggle-btn.active{ background:var(--purple); color:var(--white); }
  .phone.dark-bg .filter-chip{ background:#2C2C2E; color:#FFFFFF; }
  .phone.dark-bg .filter-chip.active{ background:var(--purple); color:var(--white); }

const CHROMATIC = ["DO","DO#","RE","RE#","MI","FA","FA#","SOL","SOL#","LA","LA#","SI"];
const NOTE_RE = /^(DO|RE|MI|FA|SOL|LA|SI)(#)?(.*)$/;

function transposeChord(chord, semitones){
  if(!chord) return chord;
  const m = chord.match(NOTE_RE);
  if(!m) return chord;
  const root = m[1] + (m[2] || "");
  const suffix = m[3] || "";
  const idx = CHROMATIC.indexOf(root);
  if(idx === -1) return chord;
  const newIdx = ((idx + semitones) % 12 + 12) % 12;
  return CHROMATIC[newIdx] + suffix;
}

function renderBlock(text, semitones){
  if(text.trim() === "RIT."){
    const el = document.createElement("div");
    el.className = "verse chorus";
    el.innerHTML = '<span class="refrain-tag">Ritornello</span>';
    return el;
  }
  let lines = text.split("\n");
  const ritMatch = lines[0].trim().match(/^\{rit(?:\s+x(\d+))?\}$/i);
  const instrMatch = lines[0].trim().match(/^\{strumentale\}$/i);
  const chorus = !!ritMatch;
  const instrumental = !!instrMatch;
  const repeatCount = ritMatch && ritMatch[1] ? parseInt(ritMatch[1], 10) : null;
  if(chorus || instrumental) lines = lines.slice(1);

  const block = document.createElement("div");
  block.className = "verse" + (chorus ? " chorus" : "") + (instrumental ? " instrumental" : "");
  if(chorus){
    const tag = document.createElement("span");
    tag.className = "refrain-tag";
    tag.textContent = "Ritornello" + (repeatCount ? ` (${repeatCount} volte)` : "");
    block.appendChild(tag);
  }
  if(instrumental){
    const tag = document.createElement("span");
    tag.className = "refrain-tag";
    tag.textContent = "Strumentale";
    block.appendChild(tag);
  }
  lines.forEach(rawLine => {
    const lineEl = document.createElement("div");
    lineEl.className = "line";
    const regex = /\[([^\]]+)\]/g;
    let lastIndex = 0, match, hadChord = false;
    while((match = regex.exec(rawLine)) !== null){
      hadChord = true;
      const before = rawLine.slice(lastIndex, match.index);
      if(before){
        const span = document.createElement("span");
        span.className = "pair" + (/\s$/.test(before) ? " pair-space" : "");
        span.innerHTML = `<span class="chord">&nbsp;</span><span class="lyric">${before}</span>`;
        lineEl.appendChild(span);
      }
      lastIndex = regex.lastIndex;
      const nextTextMatch = rawLine.slice(lastIndex).match(/^([^\[]*)/);
      let lyricAfter = nextTextMatch ? nextTextMatch[1] : "";
      const pair = document.createElement("span");
      pair.className = "pair" + ((lyricAfter === "" || /\s$/.test(lyricAfter)) ? " pair-space" : "");
      const chordName = transposeChord(match[1], semitones);
      const displayLyric = lyricAfter.trim() === "" && lyricAfter.length > 0
        ? "\u00A0\u00A0\u00A0"
        : (lyricAfter || "\u00A0");
      pair.innerHTML = `<span class="chord">${chordName}</span><span class="lyric">${displayLyric}</span>`;
      lineEl.appendChild(pair);
      lastIndex += lyricAfter.length;
      regex.lastIndex = lastIndex;
    }
    if(!hadChord){
      const span = document.createElement("span");
      span.className = "pair";
      span.innerHTML = `<span class="chord">&nbsp;</span><span class="lyric">${rawLine || "\u00A0"}</span>`;
      lineEl.appendChild(span);
    } else if(lastIndex < rawLine.length){
      const span = document.createElement("span");
      span.className = "pair";
      span.innerHTML = `<span class="chord">&nbsp;</span><span class="lyric">${rawLine.slice(lastIndex)}</span>`;
      lineEl.appendChild(span);
    }
    block.appendChild(lineEl);
  });
  return block;
}

function categoryCount(cat){
  return SONGS.filter(song => {
    if(cat.branca && !brancheOf(song).includes(cat.branca)) return false;
    if(cat.sede && !(song.sede || []).includes(cat.sede)) return false;
    if(cat.decade && ("" + Math.floor(song.anno / 10) * 10) !== cat.decade) return false;
    if(cat.genere && song.genere !== cat.genere) return false;
    if(cat.autore && song.autore !== cat.autore) return false;
    if(cat.tipo && song.tipo !== cat.tipo) return false;
    if(cat.origine && song.origine !== cat.origine) return false;
    return true;
  }).length;
}

const SECTION_TIPO = { "Scout": "scout", "Messa": "messa", "Brani famosi": "musica" };
function sectionCount(sez){
  const tipo = SECTION_TIPO[sez.label];
  return SONGS.filter(s => s.tipo === tipo).length;
}

function groupCount(nome){
  if(nome === "Canti del Roma 150") return SONGS.filter(s => s.tipo === "scout" && s.origine === "Roma 150").length;
  if(nome === "Canti AGESCI") return SONGS.filter(s => s.tipo === "scout" && s.origine === "AGESCI").length;
  return 0;
}

let LUOGO_CATEGORIES = [];
function buildLuogoCategories(){
  const conteggi = {};
  SONGS.filter(s => s.tipo === "scout" && s.origine === "Roma 150" && s.luogo).forEach(s => {
    conteggi[s.luogo] = (conteggi[s.luogo] || 0) + 1;
  });
  const luoghi = Object.keys(conteggi)
    .filter(luogo => conteggi[luogo] >= 2)
    .sort((a, b) => a.localeCompare(b, "it", { sensitivity: "base" }));
  LUOGO_CATEGORIES = luoghi.map(luogo => ({ label: luogo, tipo: "scout", origine: "Roma 150", luogo: luogo }));
}
function luoghiMetaCount(){
  return LUOGO_CATEGORIES.reduce((sum, cat) => sum + categoryCount(cat), 0);
}

function buildGenereCategories(){
  const conteggi = {};
  SONGS.filter(s => s.tipo === "musica" && s.genere).forEach(s => {
    conteggi[s.genere] = (conteggi[s.genere] || 0) + 1;

function buildAnnataCategories(){
  const musicali = SONGS.filter(s => s.tipo === "musica" && s.anno != null);
  const fasce = [
    { label: "Canti antichi", annoMax: 1899 },
    { label: "Primi del '900", annoMin: 1900, annoMax: 1949 }
  ];
  const maxAnno = musicali.reduce((max, s) => Math.max(max, s.anno), 1949);
  for(let decade = 1950; decade <= Math.floor(maxAnno / 10) * 10; decade += 10){
    fasce.push({ label: "Anni '" + String(decade).slice(-2), annoMin: decade, annoMax: decade + 9 });
  }
  fasce.forEach(fascia => {
    const cat = { gruppo: "Per annata", label: fascia.label, tipo: "musica", annoMin: fascia.annoMin, annoMax: fascia.annoMax };
    if(categoryCount(cat) > 0) CATEGORIES.push(cat);

function categoryCount(cat){
  return SONGS.filter(song => {
    if(cat.branca && song.branca !== cat.branca) return false;
    if(cat.sede && !(song.sede || []).includes(cat.sede)) return false;
    if(cat.decade && ("" + Math.floor(song.anno / 10) * 10) !== cat.decade) return false;
    if(cat.genere && song.genere !== cat.genere) return false;
    if(cat.autore && song.autore !== cat.autore) return false;
    if(cat.tipo && song.tipo !== cat.tipo) return false;
    if(cat.origine && song.origine !== cat.origine) return false;
    return true;
  }).length;
}

function matchesCategory(song, cat){
  if(cat.isLuogoMeta) return false;
  if(cat.branca && !brancheOf(song).includes(cat.branca)) return false;
  if(cat.brancaTutte && !["L/C", "E/G", "R/S"].every(b => brancheOf(song).includes(b))) return false;
  if(cat.noAmbientazione && song.ambientazione) return false;
  if(cat.luogo && song.luogo !== cat.luogo) return false;
  if(cat.sede && !(song.sede || []).includes(cat.sede)) return false;
  if(cat.decade && ("" + Math.floor(song.anno / 10) * 10) !== cat.decade) return false;
  if(cat.annoMin != null && (song.anno == null || song.anno < cat.annoMin)) return false;
  if(cat.annoMax != null && (song.anno == null || song.anno > cat.annoMax)) return false;
  if(cat.genere && song.genere !== cat.genere) return false;
  if(cat.autore && song.autore !== cat.autore) return false;
  if(cat.tipo && song.tipo !== cat.tipo) return false;
  if(cat.origine && song.origine !== cat.origine) return false;
  if(cat.ambientazione && song.ambientazione !== cat.ambientazione) return false;
  if(cat.momento && !momentiOf(song).includes(cat.momento)) return false;
  if(cat.tempo && !tempiOf(song).includes(cat.tempo)) return false;
  return true;
}

function categoryCount(cat){
  return SONGS.filter(song => matchesCategory(song, cat)).length;
}

// Effetto lente/magnete al tocco prolungato, stile Dock
(function initMagnifierNav(){
  const bottoni = Array.from(bottomNav.querySelectorAll(".nav-item"));
  let pressando = false;

  function trovaBottonePiuVicino(clientX){
    let btnPiuVicino = null, distanzaMinima = Infinity;
    bottoni.forEach(btn => {
      const rect = btn.getBoundingClientRect();
      const centro = rect.left + rect.width / 2;
      const distanza = Math.abs(clientX - centro);
      if(distanza < distanzaMinima){ distanzaMinima = distanza; btnPiuVicino = btn; }
    });
    return btnPiuVicino;
  }

  function aggiornaMagnificazione(clientX){
    bottoni.forEach(btn => {
      const rect = btn.getBoundingClientRect();
      const centro = rect.left + rect.width / 2;
      const distanza = Math.abs(clientX - centro);
      const raggio = 90;
      const scala = distanza < raggio ? 1 + (1 - distanza / raggio) * 0.525 : 1;
      const pill = btn.querySelector(".nav-pill");
      if(pill) pill.style.transform = "scale(" + scala.toFixed(3) + ")";
    });
  }

  function resetMagnificazione(){
    bottoni.forEach(btn => {
      const pill = btn.querySelector(".nav-pill");
      if(pill) pill.style.transform = "";
    });
  }

  function aggiornaAnteprimaSelezione(clientX){
    const vicino = trovaBottonePiuVicino(clientX);
    bottoni.forEach(btn => btn.classList.toggle("drag-preview", btn === vicino));
  }

  function pulisciAnteprimaSelezione(){
    bottoni.forEach(btn => btn.classList.remove("drag-preview"));
  }

  bottomNav.addEventListener("touchstart", (e) => {
    pressando = true;
    bottomNav.classList.add("dragging");
    aggiornaMagnificazione(e.touches[0].clientX);
    aggiornaAnteprimaSelezione(e.touches[0].clientX);
  }, { passive: true });

  bottomNav.addEventListener("touchmove", (e) => {
    if(!pressando) return;
    aggiornaMagnificazione(e.touches[0].clientX);
    aggiornaAnteprimaSelezione(e.touches[0].clientX);
  }, { passive: true });

  bottomNav.addEventListener("touchend", (e) => {
    if(!pressando) return;
    pressando = false;
    bottomNav.classList.remove("dragging");
    const ultimoTouch = e.changedTouches[0];
    const btnPiuVicino = trovaBottonePiuVicino(ultimoTouch.clientX);
    if(btnPiuVicino) showTab(btnPiuVicino.dataset.tab);
    resetMagnificazione();
    pulisciAnteprimaSelezione();
  });

  bottomNav.addEventListener("touchcancel", () => {
    pressando = false;
    bottomNav.classList.remove("dragging");
    resetMagnificazione();
    pulisciAnteprimaSelezione();
  });
})();

  "scolte": "r/s"
};

function normalizeText(str){
  return String(str || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase();
}

function matchesSearch(song, query){
  if(!query.trim()) return true;
  const plainLyrics = (song.testo_accordi || "").replace(/\[[^\]]+\]/g, " ");
  const sede = (song.sede || []).join(" ");
  const haystack = normalizeText([
    song.titolo || "",
    String(song.anno || ""),
    song.luogo || "",
    brancheOf(song).join(" "),
    sede,    song.tonalita || "",
    song.autore || "",
    song.genere || "",
    song.tipo || "",
    momentiOf(song).join(" "),
    tempiOf(song).join(" "),
    song.ambientazione || "",
    plainLyrics
  ].join(" "));

  const tokens = normalizeText(query).split(/\s+/).filter(Boolean);
  return tokens.every(token => haystack.includes(token) || (SEARCH_ALIASES[token] && haystack.includes(SEARCH_ALIASES[token])));
}

function groupSongs(list){
  const sorted = [...list].sort((a, b) => {
    if(sortMode === "alpha"){
      return a.titolo.localeCompare(b.titolo, "it", { sensitivity: "base" }) * sortDir;
    }
    return (a.anno - b.anno) * sortDir;
  });

  const groups = [];
  let lastKey = null;
  sorted.forEach(song => {
    let key;
    if(sortMode === "alpha"){
      const primaLettera = (song.titolo.trim()[0] || "#").toUpperCase();
      key = /[0-9]/.test(primaLettera) ? "1-9" : primaLettera;
    } else if(song.anno < 1900){
      const century = Math.floor(song.anno / 100) * 100;
      key = String(century);
    } else {
      const decade = Math.floor(song.anno / 10) * 10;
      key = "Anni " + decade;
    }
    if(key !== lastKey){
      groups.push({ key, songs: [] });
      lastKey = key;
    }
    groups[groups.length - 1].songs.push(song);
  });
  return groups;
}

function wireUpdateBtn(){
  const btn = document.getElementById("headerUpdate");
  if(!btn) return;
  btn.classList.toggle("offline", !navigator.onLine);
  btn.classList.toggle("has-update", updateAvailable);
  btn.addEventListener("click", async () => {
    if(!navigator.onLine || btn.classList.contains("updating")) return;
    btn.classList.add("updating");
    try{
      if("serviceWorker" in navigator){
        const reg = await navigator.serviceWorker.getRegistration();
        if(reg && reg.active){
          reg.active.postMessage("CLEAR_APP_SHELL_CACHE");
        }
        if(reg) await reg.update();
      }
    } catch(e){ /* proseguo comunque con il ricaricamento */ }
    setTimeout(() => window.location.reload(), 400);
  });
}

function annoLabel(song){
  if(song.anno == null) return "";
  if(song.anno_incerto){
    const decade = Math.floor(song.anno / 10) * 10;
    if(decade >= 1930){
      return "Anni '" + String(decade).slice(-2);
    }
    if(decade >= 1900){
      return "Anni '" + String(decade).slice(-3);
    }
    const century = Math.floor(song.anno / 100) * 100;
    return "Anni '" + String(century).slice(-3);
  }
  return String(song.anno);
}

function metaLine(song){
  let parts;
  if(song.tipo === "musica"){
    parts = [annoLabel(song), song.autore, song.genere];
  } else if(song.tipo === "messa"){
    parts = [annoLabel(song), momentiOf(song).join(" - "), tempiOf(song).join(" - ")];  } else {
    parts = [annoLabel(song), song.luogo, brancheOf(song).join(" / "), song.ambientazione];
    if(song.sede && song.sede.length) parts.push(song.sede.join(", "));
  }
  return parts.filter(Boolean).join(" · ");
}

function matchesFilters(song){
  const brancaOk = selectedBranche.size === 0 || song.tipo !== "scout" || brancheOf(song).some(b => selectedBranche.has(b));
  const sedeOk = selectedSedi.size === 0 || song.tipo !== "scout" || (song.sede || []).some(s => selectedSedi.has(s));
  const decadeOk = selectedDecadi.size === 0 || selectedDecadi.has("" + Math.floor(song.anno / 10) * 10);
  const genereOk = selectedGeneri.size === 0 || selectedGeneri.has(song.genere);
  const autoreOk = selectedAutori.size === 0 || selectedAutori.has(song.autore);
  const momentoOk = selectedMomenti.size === 0 || momentiOf(song).some(m => selectedMomenti.has(m));
  const tempoOk = selectedTempi.size === 0 || tempiOf(song).some(t => selectedTempi.has(t));
  const tipoOk = selectedTipi.size === 0 || selectedTipi.has(song.tipo);
  const origineOk = selectedOrigini.size === 0 || song.tipo !== "scout" || selectedOrigini.has(song.origine);
  const favOk = !showOnlyFavorites || favoriti.has(favKey(song));
  return brancaOk && sedeOk && decadeOk && genereOk && autoreOk && momentoOk && tempoOk && tipoOk && origineOk && favOk;}

function renderResults(card){
  let results = card.querySelector("#resultsArea");
  results.innerHTML = "";

  const filtered = SONGS.filter(song => matchesFilters(song) && matchesSearch(song, searchQuery));

  if(filtered.length === 0){
    results.innerHTML = `<div class="empty">Nessuna canzone trovata${searchQuery ? ` per "${searchQuery}"` : ""}.</div>`;
    return;
  }

  groupSongs(filtered).forEach(group => {
    const divider = document.createElement("div");
    divider.className = "group-divider";
    divider.textContent = group.key;
    results.appendChild(divider);

    group.songs.forEach(song => {

      row.className = "song-row";
      row.innerHTML = `
        <div>

          <span class="key-badge">${ICONS.music(12)}${song.tonalita || "—"}</span>
          <button class="fav-star ${isFav ? "active" : ""}" aria-label="Preferita">${ICONS.star(19, isFav)}</button>
          ${ICONS.chevronRight(18)}
        </div>
      `;
      row.addEventListener("click", () => showDetail(SONGS.indexOf(song)));
      row.querySelector(".fav-star").addEventListener("click", (e) => {
        e.stopPropagation();
        if(favoriti.has(favKey(song))) favoriti.delete(favKey(song));
        else favoriti.add(favKey(song));
        saveFavorites();
        renderResults(card);
      });
      results.appendChild(row);
    });
  });
}

  const chordToggleTile = document.getElementById("chordToggleTile");
  const chordToggleIcon = document.getElementById("chordToggleIcon");
  const chordToggleStateName = document.getElementById("chordToggleStateName");
  chordToggleTile.addEventListener("click", () => {
    chordsVisible = !chordsVisible;
    card2.classList.toggle("chords-hidden", !chordsVisible);
    chordToggleIcon.innerHTML = chordsVisible ? ICONS.chordsOn(20) : ICONS.chordsOff(20);
    chordToggleStateName.textContent = chordsVisible ? "Mostra" : "Nascondi";
    footer.textContent = chordsVisible
      ? (song.tonalita ? ("Trasposizione automatica · tonalità originale " + song.tonalita) : "Canzone senza accordi")
      : "";
  });

  const card2 = document.createElement("div");
  card2.className = "card";
  const body = document.createElement("div");
  card2.appendChild(body);
  content.appendChild(card2);

  const backBtn = document.createElement("button");
  backBtn.className = "pill-btn active";
  backBtn.style.width = "100%";
  backBtn.style.justifyContent = "center";
  backBtn.style.marginTop = "4px";
  backBtn.innerHTML = `${ICONS.arrowBack(16)}${returnToViewLabel}`;
  backBtn.addEventListener("click", goBack);
  content.appendChild(backBtn);

  function render(){
    body.innerHTML = "";
    const blocks = song.testo_accordi.split(/\n===\n/);
    blocks.forEach(b => {
      b.split(/\n---\n/).forEach(sub => body.appendChild(renderBlock(sub, semitones)));
    });
    document.getElementById("currentKey").textContent = song.tonalita ? transposeChord(song.tonalita, semitones) : "—";
  }

  document.getElementById("up").addEventListener("click", () => { semitones++; render(); });
  document.getElementById("down").addEventListener("click", () => { semitones--; render(); });

  const SCROLL_SPEEDS = [
    { label: "1×", step: 1, interval: 55 },
    { label: "2×", step: 1, interval: 30 },
    { label: "3×", step: 2, interval: 22 }
  ];
  let speedIndex = -1; // -1 = fermo
  let scrollInterval = null;
  const scrollBtn = document.getElementById("scrollToggle");
  const scrollIcon = document.getElementById("scrollIcon");
  const scrollStateName = document.getElementById("scrollStateName");

  function stopScroll(){
    speedIndex = -1;
    scrollBtn.classList.remove("active");
    scrollIcon.innerHTML = ICONS.play(20);
    scrollStateName.textContent = "";
    clearInterval(scrollInterval);
  }

  function startScrollAt(index){
    speedIndex = index;
    const speed = SCROLL_SPEEDS[speedIndex];
    scrollBtn.classList.add("active");
    scrollIcon.innerHTML = ICONS.pause(20);
    scrollStateName.textContent = speed.label;
    clearInterval(scrollInterval);
    scrollInterval = setInterval(() => {
      window.scrollBy({ top: speed.step, behavior: "auto" });
      if(window.innerHeight + window.scrollY >= document.body.scrollHeight){
        stopScroll();
      }
    }, speed.interval);
  }

  scrollBtn.addEventListener("click", () => {
    if(speedIndex === -1){
      startScrollAt(0);
    } else if(speedIndex < SCROLL_SPEEDS.length - 1){
      startScrollAt(speedIndex + 1);
    } else {
      stopScroll();
    }
  });

  render();
  footer.textContent = song.tonalita ? ("Trasposizione automatica · tonalità originale " + song.tonalita) : "Canzone senza accordi";
}

if(/Android/i.test(navigator.userAgent)){
  document.body.classList.add("is-android");
}

const isIPhoneDevice = /iPhone|iPod/i.test(navigator.userAgent);
let wasOverlayVisible = false;
let lockSuggestTimeout = null;

function showLockSuggestToast(){
  const toast = document.getElementById("lockSuggestToast");
  if(!toast) return;
  toast.classList.add("visible");
  clearTimeout(lockSuggestTimeout);
  lockSuggestTimeout = setTimeout(() => toast.classList.remove("visible"), 6000);
}

function updateOrientationOverlay(){
  const overlay = document.getElementById("orientationOverlay");
  if(!overlay) return;
  const isLandscape = window.matchMedia("(orientation: landscape)").matches;
  const isOverlayVisible = isIPhoneDevice && isLandscape;
  overlay.classList.toggle("visible", isOverlayVisible);
  if(wasOverlayVisible && !isOverlayVisible){
    showLockSuggestToast();
  }
  wasOverlayVisible = isOverlayVisible;
}
if(isIPhoneDevice){
  window.addEventListener("resize", updateOrientationOverlay);
  window.addEventListener("orientationchange", updateOrientationOverlay);
  updateOrientationOverlay();
  const lockSuggestClose = document.getElementById("lockSuggestClose");
  if(lockSuggestClose){
    lockSuggestClose.addEventListener("click", () => {
      document.getElementById("lockSuggestToast").classList.remove("visible");
      clearTimeout(lockSuggestTimeout);
    });
  }
}

document.querySelector(".phone").classList.toggle("dark-bg", detailDarkMode);
renderHeaderBrand();
setActiveTab("canzoni");
checkForUpdate();

fetch("songs.json")
  .then(r => r.json())
  .then(data => { SONGS = data; buildLuogoCategories(); buildGenereCategories(); buildAutoreCategories(); buildAnnataCategories(); showList(); })
  .catch(() => {
    content.innerHTML = '<div class="card"><div class="empty">Impossibile caricare le canzoni. Controlla la connessione e riprova.</div></div>';
  });

if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(() => {});
  });
}
</script>
</body>
</html>
