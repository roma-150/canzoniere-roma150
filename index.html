<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Canzoniere Roma 150</title>
<meta name="theme-color" content="#3B2065">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-ios.jpg">
<link rel="icon" type="image/jpeg" href="icons/icon-ios.jpg">
<style>
  :root{
    --text-scale:1;
    --purple:#381E60;
    --gold:#D89B00;
    --green:#00AE04;
    --bg:#F8F9FC;
    --white:#FFFFFF;
    --ink:#1C1C1E;
    --ink-soft:#6E6E73;
    --neutral:#F0F0F3;
    --border:#E5E5EA;
    --lilac:#F1EDF7;
    --green-tint-a:#EAF9EA;
    --green-tint-b:#F5FCF5;
    --amber:#A9720B;
    --amber-tint:#FBF2DC;
    --phone-max-width:clamp(430px, 100vw, 900px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    background:var(--purple);
    min-height:100vh;
  }
  .phone{ width:100%; max-width:var(--phone-max-width); min-height:100vh; display:flex; flex-direction:column; padding-bottom:100px; background:var(--bg); }

  .bottom-nav{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom) * 0.6);
    width:calc(100% - 24px); max-width:calc(var(--phone-max-width) - 24px);
    display:flex;
    background:rgba(255,255,255,0.55);
    -webkit-backdrop-filter:blur(24px) saturate(180%) contrast(115%);
    backdrop-filter:blur(24px) saturate(180%) contrast(115%);
    border:1px solid rgba(255,255,255,0.7);
    border-bottom-color:rgba(255,255,255,0.25);
    border-radius:28px;
    padding:6px 10px;
    box-shadow:0 8px 32px rgba(56,30,96,0.20), inset 0 1px 0 rgba(255,255,255,0.65), inset 0 -1px 0 rgba(0,0,0,0.05);
    z-index:20;
    transition:opacity 0.28s cubic-bezier(0.34, 1.4, 0.64, 1), transform 0.28s cubic-bezier(0.34, 1.4, 0.64, 1);
  }
  .bottom-nav::before{
    content:"";
    position:absolute; inset:0;
    z-index:-1;
    border-radius:28px;
    background:linear-gradient(180deg, rgba(255,255,255,0.35), rgba(255,255,255,0) 55%);
    pointer-events:none;
  }
  .bottom-nav.hidden{
    opacity:0;
    pointer-events:none;
    transform:translateX(-50%) translateY(24px) scale(0.92);
    transition:opacity 0.32s ease-out, transform 0.32s ease-out;
  }
  body.is-android .bottom-nav{
    bottom:calc(env(safe-area-inset-bottom) * 0.6 + 10px);
  }
  .nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center;
    background:none; border:none; cursor:pointer; color:#8E8E93;
    padding:2px 0;
  }
  .nav-pill{
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:6px 10px 5px; border-radius:16px;
    transition:background 0.25s ease, box-shadow 0.25s ease, transform 0.12s ease-out;
    transform-origin:center bottom;
  }
  .nav-item i{ font-size:21px; }
  .nav-item span{ font-size:10.5px; font-weight:700; }
  .nav-item.active{ color:var(--purple); }
  .nav-item.active .nav-pill{
    background:rgba(56,30,96,0.14);
    box-shadow:inset 0 1px 1px rgba(255,255,255,0.6), 0 1px 3px rgba(56,30,96,0.15);
  }
  .bottom-nav.dragging .nav-item.active{ color:#8E8E93; }
  .bottom-nav.dragging .nav-item.active .nav-pill{ background:transparent; box-shadow:none; }
  .nav-item.drag-preview{ color:var(--purple); }
  .nav-item.drag-preview .nav-pill{
    background:rgba(56,30,96,0.14);
    box-shadow:inset 0 1px 1px rgba(255,255,255,0.6), 0 1px 3px rgba(56,30,96,0.15);
  }

  .phone.dark-bg .bottom-nav{
    background:rgba(28,28,30,0.55);
    border-color:rgba(255,255,255,0.14);
    border-bottom-color:rgba(255,255,255,0.05);
    box-shadow:0 8px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1), inset 0 -1px 0 rgba(0,0,0,0.2);
  }
  .phone.dark-bg .bottom-nav::before{
    background:linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0) 55%);
  }
  .phone.dark-bg .nav-item{ color:#8E8E93; }
  .phone.dark-bg .nav-item.active{ color:#F2F2F7; }
  .phone.dark-bg .nav-item.active .nav-pill{
    background:rgba(255,255,255,0.16);
    box-shadow:inset 0 1px 1px rgba(255,255,255,0.2), 0 1px 3px rgba(0,0,0,0.3);
  }
  .phone.dark-bg .bottom-nav.dragging .nav-item.active{ color:#8E8E93; }
  .phone.dark-bg .bottom-nav.dragging .nav-item.active .nav-pill{ background:transparent; box-shadow:none; }
  .phone.dark-bg .nav-item.drag-preview{ color:#F2F2F7; }
  .phone.dark-bg .nav-item.drag-preview .nav-pill{
    background:rgba(255,255,255,0.16);
    box-shadow:inset 0 1px 1px rgba(255,255,255,0.2), 0 1px 3px rgba(0,0,0,0.3);
  }

  .placeholder-card{ text-align:center; padding:36px 20px; }

  .back-to-top{
    position:fixed; right:max(18px, calc((100vw - var(--phone-max-width)) / 2 + 18px)); bottom:calc(78px + env(safe-area-inset-bottom));
    width:46px; height:46px; border-radius:50%; border:none;
    background:var(--purple); color:var(--white);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 18px rgba(30,20,50,0.22);
    cursor:pointer; z-index:19;
    opacity:0; pointer-events:none; transform:translateY(8px);
    transition:opacity 0.15s ease, transform 0.15s ease;
  }
  .back-to-top.visible{ opacity:1; pointer-events:auto; transform:translateY(0); }

  .scroll-float{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(78px + env(safe-area-inset-bottom));
    height:46px;
    z-index:21;
    background:var(--purple); color:var(--white);
    border-radius:999px; padding:0 12px;
    display:none; align-items:center; gap:6px;
    box-shadow:0 6px 18px rgba(30,20,50,0.28);
  }
  .scroll-float.visible{ display:flex; }
  .scroll-float button{
    width:32px; height:32px; border-radius:50%; border:1.5px solid rgba(255,255,255,0.6);
    background:transparent; color:var(--white); font-size:16px; font-weight:700;
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; padding:0;
  }
  .scroll-float button:active{ background:rgba(255,255,255,0.15); }
  #scrollFloatPlayPause{ background:rgba(255,255,255,0.18); border:none; }
  .scroll-float-label{ font-size:12.5px; font-weight:700; white-space:nowrap; }
  .placeholder-icon{
    width:56px; height:56px; border-radius:16px; margin:0 auto 14px;
    background:var(--neutral); color:var(--purple); font-size:26px;
    display:flex; align-items:center; justify-content:center;
  }
  .placeholder-card h2{ font-size:17px; font-weight:800; margin:0 0 6px; }
  .placeholder-card p{ font-size:13.5px; color:var(--ink-soft); line-height:1.5; margin:0; }

  .app-header{
    background:var(--purple);
    color:var(--white);
    padding:12px 20px 13px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:relative;
  }
  .app-header.sticky{
    position:sticky;
    top:0;
    z-index:15;
  }
  .header-spacer{ width:44px; flex-shrink:0; }
  .header-version{
    font-size:11px; font-weight:600; letter-spacing:0.02em;
    color:rgba(255,255,255,0.6); flex-shrink:0;
  }
  .header-update-btn{
    width:44px; height:44px; border-radius:14px; flex-shrink:0;
    background:rgba(255,255,255,0.14); border:none; color:var(--white);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:opacity 0.2s ease;
  }
  .header-update-btn:active{ background:rgba(255,255,255,0.24); }
  .header-update-btn.offline{ opacity:0.35; pointer-events:none; }
  .header-update-btn.updating svg{ animation:spin 0.8s linear infinite; }
  .header-update-btn.has-update::after{
    content:""; position:absolute; top:6px; right:6px;
    width:9px; height:9px; border-radius:50%;
    background:#E4573D; border:1.5px solid var(--purple);
  }
  .header-update-btn{ position:relative; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .brand-text-center{
    position:absolute; left:calc(50% - 23px); top:50%;
    transform:translate(-50%, -50%);
    text-align:center; white-space:nowrap; pointer-events:none;
  }
  .brand-text-center .name{ font-size:17px; font-weight:800; letter-spacing:0.01em; }
  .brand-text-center .sub{ font-size:12px; color:rgba(255,255,255,0.65); font-weight:500; margin-top:1px; }
  .header-back-btn{
    width:44px; height:44px; border-radius:14px;
    background:rgba(255,255,255,0.14);
    border:none; color:var(--white); font-size:20px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0;
  }
  .header-back-btn:active{ background:rgba(255,255,255,0.24); }
  .header-actions{ display:flex; align-items:center; gap:8px; flex-shrink:0; }

  .content{ padding:18px 16px 0; flex:1; }
  .phone.dark-bg{ background:#131315; }
  .phone.dark-bg footer{ color:#9A9AA0; }

  .card{
    background:var(--white);
    border-radius:24px;
    padding:22px 20px;
    box-shadow:0 4px 20px rgba(30,20,50,0.06);
    margin-bottom:16px;
  }

  /* elenco */
  .back-link{
    display:inline-flex; align-items:center; gap:4px;
    color:var(--purple); font-weight:700; font-size:14px;
    background:none; border:none; padding:0 0 14px; cursor:pointer;
  }
  .list-title{ font-size:19px; font-weight:800; margin:0 0 14px; }
  .list-title-count{ font-size:13px; font-weight:600; color:var(--ink-soft); }
  .cat-group-title{ cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .cat-group-chevron{ display:flex; align-items:center; flex-shrink:0; color:var(--ink-soft); transition:transform 0.2s ease; }
  .cat-group-title.open .cat-group-chevron{ transform:rotate(90deg); }
  .cat-group-rows{ max-height:0; overflow:hidden; transition:max-height 0.3s ease; }
  .cat-group-rows.open{ max-height:3000px; }

  .search-filter-row{
    display:flex; align-items:center; margin-bottom:12px;
    position:sticky; top:0; z-index:5;
  }
  .search-box{
    display:flex; align-items:center; gap:8px; flex:1; min-width:0;
    background:var(--neutral); border-radius:12px; padding:10px 14px;
    transition:width 0.32s cubic-bezier(0.4,0,0.2,1);
  }
  .search-filter-row.stuck{ box-shadow:0 6px 14px rgba(28,28,30,0.10); border-radius:12px; }
  .search-box i{ color:var(--ink-soft); font-size:17px; }
  .search-box input{
    border:none; background:transparent; flex:1; font-size:14.5px;
    color:var(--ink); outline:none; font-family:inherit;
  }
  .search-box input::placeholder{ color:var(--ink-soft); }
  .search-clear-btn{
    display:none; align-items:center; justify-content:center;
    width:20px; height:20px; border-radius:50%; border:none; flex-shrink:0;
    background:var(--border); color:var(--ink-soft); cursor:pointer; padding:0;
  }
  .search-clear-btn.visible{ display:flex; }

  .filter-toggle-btn{
    flex:0 0 38px; width:38px; height:38px; border-radius:12px; border:none;
    margin-left:8px; padding:0; min-width:0; background:var(--neutral); color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    overflow:hidden;
    transition:flex-basis 0.32s cubic-bezier(0.4,0,0.2,1), width 0.32s cubic-bezier(0.4,0,0.2,1), margin-left 0.32s cubic-bezier(0.4,0,0.2,1), opacity 0.22s ease;
  }
  .filter-toggle-btn.active{ background:var(--purple); color:var(--white); }
  .search-filter-row.collapsed .filter-toggle-btn{
    flex-basis:0; width:0; margin-left:0; opacity:0; pointer-events:none;
  }

  .filter-panel{ max-height:0; overflow:hidden; transition:max-height 0.28s ease; }
  .filter-panel.open{ max-height:320px; }
  .filter-row{ margin-bottom:10px; padding-top:2px; }
  .filter-row .filter-label{ font-size:11px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:6px; }
  .filter-chips{ display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
  .filter-chips::-webkit-scrollbar{ display:none; }
  .filter-chip{
    flex-shrink:0; border:none; border-radius:999px; padding:7px 14px;
    font-size:12.5px; font-weight:700; background:var(--neutral); color:var(--ink-soft);
    cursor:pointer; white-space:nowrap;
    display:inline-flex; align-items:center; gap:5px;
  }
  .filter-chip.active{ background:var(--purple); color:var(--white); }

  .sort-row{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .segmented{
    display:flex; background:var(--neutral); border-radius:12px; padding:3px; flex:1;
  }
  .segmented button{
    flex:1; border:none; background:transparent; border-radius:9px;
    padding:8px 10px; font-size:13.5px; font-weight:700; color:var(--ink-soft);
    cursor:pointer;
  }
  .segmented button.active{ background:var(--purple); color:var(--white); box-shadow:0 1px 4px rgba(0,0,0,0.08); }
  .dir-btn{
    width:38px; height:38px; border-radius:12px; border:none;
    background:var(--neutral); color:var(--ink-soft); font-size:17px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .dir-btn:active{ background:var(--border); }
  .settings-icon-btn{
    width:38px; height:38px; border-radius:12px; border:none;
    background:var(--neutral); color:var(--purple);
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .settings-icon-btn.active{ background:var(--purple); color:var(--white); }
  .phone.dark-bg .settings-icon-btn{ background:#2C2C2E; color:#FFFFFF; }
  .phone.dark-bg .settings-icon-btn.active{ background:var(--purple); color:var(--white); }

  .group-divider{
    font-size:12px; font-weight:800; color:var(--purple);
    background:var(--lilac); padding:6px 20px; margin:16px -20px 2px;
    letter-spacing:0.04em; text-transform:uppercase;
  }
  .group-divider:first-of-type{ margin-top:10px; }
  .song-row{
    display:flex; align-items:center; justify-content:space-between; gap:6px;
    padding:14px 4px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
  }
  .song-row:last-child{ border-bottom:none; }
  .song-row .row-title{ font-size:16px; font-weight:700; color:var(--ink); }
  .song-row .row-meta{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .row-meta{ color:var(--ink-soft); }
  .song-row i{ color:var(--ink-soft); font-size:18px; }
  .row-end{ display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .fav-star{
    border:none; background:none; padding:6px; margin:-6px;
    color:#D8D6DE; display:flex; align-items:center; cursor:pointer; flex-shrink:0;
  }
  .fav-star.active{ color:var(--gold); }
  .cz-remove-btn{
    border:none; background:none; padding:6px; margin:-6px;
    color:var(--purple); display:flex; align-items:center; cursor:pointer; flex-shrink:0;
  }
  .phone.dark-bg .cz-remove-btn{ color:var(--white); }
  .cz-order-num{
    min-width:20px; text-align:center; flex-shrink:0;
    font-size:13px; font-weight:800; color:var(--purple);
  }
  .cz-section-row{ background:rgba(56,30,96,0.06); border-radius:12px; }
  .cz-edit-btn, .cz-print-btn{ color:var(--purple); }
  .cz-section-title{ color:var(--purple); }
  .cz-title-detail{ color:var(--ink); }
  .phone.dark-bg .cz-title-detail{ color:#F2F2F7; }
  .phone.dark-bg .cz-edit-btn, .phone.dark-bg .cz-print-btn{ color:var(--white); }
  .cz-delete-btn{ color:#B3261E; }
  .phone.dark-bg .cz-delete-btn{ color:var(--white); }
  .phone.dark-bg .cz-section-row{ background:#241C33; }
  .phone.dark-bg .cz-section-title{ color:#C9B8E8; }
  .phone.dark-bg .cz-section-row .cz-order-num{ color:#C9B8E8; }
  .phone.dark-bg .cz-order-num{ color:var(--white); }
  .cz-drag-handle{
    display:flex; align-items:center; color:var(--purple); flex-shrink:0; padding:6px; margin:-6px;
    cursor:grab; touch-action:none; user-select:none; -webkit-user-drag:none;
  }
  .cz-drag-handle svg{ -webkit-user-drag:none; pointer-events:none; }
  .cz-dragging{
  cursor:grabbing;
  opacity:1;
  position:relative;
  z-index:5;
  background:var(--card-bg, #fff);
  box-shadow:0 8px 20px rgba(0,0,0,0.25);
}
  .phone.dark-bg .cz-drag-handle{ color:var(--white); }

  .cz-insert-row{ height:0; position:relative; z-index:2; }
  .cz-insert-inner{
    position:absolute; left:50%; top:0;
    transform:translate(-50%, -50%);
    display:flex; align-items:center; gap:10px;
  }
  .cz-insert-plus{
    display:flex; align-items:center; justify-content:center;
    width:26px; height:26px; border-radius:50%; border:none;
    color:var(--purple); background:var(--lilac); cursor:pointer; padding:0;
    box-shadow:0 1px 4px rgba(30,20,50,0.18);
  }
  .phone.dark-bg .cz-insert-plus{ background:#2C2C2E; color:#C9B8E8; }
  .cz-insert-choice{
    display:flex; align-items:center; justify-content:center;
    width:30px; height:30px; border-radius:50%; border:none;
    color:var(--white); background:var(--purple); cursor:pointer; padding:0;
    box-shadow:0 1px 4px rgba(30,20,50,0.18);
  }
  .phone.dark-bg .cz-insert-choice{ background:#4A3670; }

  .cz-picker-overlay{
    position:fixed; inset:0; z-index:30;
    background:rgba(0,0,0,0.45);
    display:flex; align-items:flex-end; justify-content:center;
  }
  .cz-picker-panel{
    width:100%; max-width:var(--phone-max-width);
    background:var(--white); border-radius:22px 22px 0 0;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    max-height:75vh; display:flex; flex-direction:column;
  }
  .phone.dark-bg .cz-picker-panel{ background:#1C1C1E; }
  .cz-picker-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
  .cz-picker-close{
    border:none; background:var(--neutral); color:var(--ink-soft);
    width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0;
  }
  .phone.dark-bg .cz-picker-close{ background:#2C2C2E; color:#FFFFFF; }
  .cz-picker-results{ flex:1; overflow-y:auto; margin-top:6px; }
  .cz-type-icon{
    width:30px; height:30px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .cz-typed-detail-text{ white-space:pre-wrap; font-size:14px; line-height:1.5; color:var(--ink); max-height:50vh; overflow-y:auto; }
  .phone.dark-bg .cz-typed-detail-text{ color:#F2F2F7; }

  .key-badge{
    display:flex; align-items:center; gap:3px; flex-shrink:0;
    font-size:11.5px; font-weight:800; color:var(--gold);
    background:rgba(216,155,0,0.12); border-radius:8px; padding:4px 7px 4px 6px;
  }
  .cz-tipo-badge{
    display:inline-flex; align-items:center; flex-shrink:0;
    font-size:11px; font-weight:800; color:var(--purple);
    background:rgba(56,30,96,0.10); border-radius:8px; padding:4px 8px;
  }
  .phone.dark-bg .cz-tipo-badge{ background:rgba(255,255,255,0.14); color:#F2F2F7; }

  /* dettaglio */
  .card-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .detail-nav-btns{ display:flex; flex-direction:column; align-items:center; gap:2px; flex-shrink:0; }
  .detail-nav-icons{ display:flex; gap:4px; }
  .detail-nav-btn{
    border:none; background:none; padding:10px; margin:-4px;
    color:var(--purple); display:flex; align-items:center; cursor:pointer;
  }
  .phone.dark-bg .detail-nav-btn{ color:var(--white); }
  .detail-nav-page{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .detail-nav-page-bottom{ font-size:11.5px; color:var(--ink-soft); text-align:right; margin-top:14px; }
  .song-title{ font-size:23px; font-weight:800; color:var(--ink); line-height:1.25; margin:0; }
  .song-meta{ font-size:13px; color:var(--ink-soft); font-weight:600; margin-top:4px; }
  .song-meta.sede-row{ margin-top:2px; }

  .pill-btn{

  .header-dark-btn{

  .empty{ text-align:center; color:var(--ink-soft); font-size:14px; padding:30px 10px; }

  .form-input{

  }

const CHROMATIC = ["DO","DO#","RE","RE#","MI","FA","FA#","SOL","SOL#","LA","LA#","SI"];
const NOTE_RE = /^(DO|RE|MI|FA|SOL|LA|SI)(#)?(.*)$/;

function transposeChord(chord, semitones){
  if(!chord) return chord;
  const m = chord.match(NOTE_RE);
  if(!m) return chord;
  const root = m[1] + (m[2] || "");
  const suffix = m[3] || "";
  const idx = CHROMATIC.indexOf(root);
  if(idx === -1) return chord;
  const newIdx = ((idx + semitones) % 12 + 12) % 12;
  return CHROMATIC[newIdx] + suffix;
}

function renderBlock(text, semitones){
  if(text.trim() === "RIT."){
    const el = document.createElement("div");
    el.className = "verse chorus";
    el.innerHTML = '<span class="refrain-tag">Ritornello</span>';
    return el;
  }
  let lines = text.split("\n");
  const ritMatch = lines[0].trim().match(/^\{rit(?:\s+x(\d+))?\}$/i);
  const instrMatch = lines[0].trim().match(/^\{strumentale\}$/i);
  const chorus = !!ritMatch;
  const instrumental = !!instrMatch;
  const repeatCount = ritMatch && ritMatch[1] ? parseInt(ritMatch[1], 10) : null;
  if(chorus || instrumental) lines = lines.slice(1);

  const block = document.createElement("div");
  block.className = "verse" + (chorus ? " chorus" : "") + (instrumental ? " instrumental" : "");
  if(chorus){
    const tag = document.createElement("span");
    tag.className = "refrain-tag";
    tag.textContent = "Ritornello" + (repeatCount ? ` (${repeatCount} volte)` : "");
    block.appendChild(tag);
  }
  if(instrumental){
    const tag = document.createElement("span");
    tag.className = "refrain-tag";
    tag.textContent = "Strumentale";
    block.appendChild(tag);
  }
  lines.forEach(rawLine => {
    const lineEl = document.createElement("div");
    lineEl.className = "line";
    const regex = /\[([^\]]+)\]/g;
    let lastIndex = 0, match, hadChord = false;
    while((match = regex.exec(rawLine)) !== null){
      hadChord = true;
      const before = rawLine.slice(lastIndex, match.index);
      if(before){
        const span = document.createElement("span");
        span.className = "pair" + (/\s$/.test(before) ? " pair-space" : "");
        span.innerHTML = `<span class="chord">&nbsp;</span><span class="lyric">${before}</span>`;
        lineEl.appendChild(span);
      }
      lastIndex = regex.lastIndex;
      const nextTextMatch = rawLine.slice(lastIndex).match(/^([^\[]*)/);
      let lyricAfter = nextTextMatch ? nextTextMatch[1] : "";
      const pair = document.createElement("span");
      pair.className = "pair" + ((lyricAfter === "" || /\s$/.test(lyricAfter)) ? " pair-space" : "");
      const chordName = transposeChord(match[1], semitones);
      const displayLyric = lyricAfter.trim() === "" && lyricAfter.length > 0
        ? "\u00A0\u00A0\u00A0"
        : (lyricAfter || "\u00A0");
      pair.innerHTML = `<span class="chord">${chordName}</span><span class="lyric">${displayLyric}</span>`;
      lineEl.appendChild(pair);
      lastIndex += lyricAfter.length;
      regex.lastIndex = lastIndex;
    }
    if(!hadChord){
      const span = document.createElement("span");
      span.className = "pair";
      span.innerHTML = `<span class="chord">&nbsp;</span><span class="lyric">${rawLine || "\u00A0"}</span>`;
      lineEl.appendChild(span);
    } else if(lastIndex < rawLine.length){
      const span = document.createElement("span");
      span.className = "pair";
      span.innerHTML = `<span class="chord">&nbsp;</span><span class="lyric">${rawLine.slice(lastIndex)}</span>`;
      lineEl.appendChild(span);
    }
    block.appendChild(lineEl);
  });
  return block;
}

  try { localStorage.setItem(EVENTS_QUEUE_KEY, JSON.stringify(queue)); }
  catch(e){ /* localStorage non disponibile, la coda eventi non persister\u00e0 */ }
}
function queueEvento(payload){
  const queue = loadEventQueue();
  queue.push(payload);
  saveEventQueue(queue);
}
function inviaEvento(payload){
  return fetch(ANALYTICS_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  });
}
function logEvento(tipo, titolo){
  if(!ANALYTICS_URL || ANALYTICS_URL.indexOf("http") !== 0) return;
  const payload = { tipo, titolo: titolo || "", utente: DEVICE_ID, nome: USERNAME };
  if(!navigator.onLine){
    queueEvento(payload);
    return;
  }
  try {
    inviaEvento(payload).catch(() => queueEvento(payload));
  } catch(e){ queueEvento(payload); }
}
function flushEventQueue(){
  if(!ANALYTICS_URL || ANALYTICS_URL.indexOf("http") !== 0) return;
  if(!navigator.onLine) return;
  const queue = loadEventQueue();
  if(queue.length === 0) return;
  saveEventQueue([]);
  queue.forEach(payload => {
    try {
      inviaEvento(payload).catch(() => queueEvento(payload));
    } catch(e){ queueEvento(payload); }
  });
}

async function shareCzJson(cz){
  const payload = {
    titolo: cz.titolo,
    descrizione: cz.descrizione || "",
    tipo: czTipoOf(cz),
    canzoni: cz.canzoni
  };
  const jsonText = JSON.stringify(payload);

  function copyToClipboard(){
    const done = () => alert("Canzoniere copiato negli appunti. Ora puoi incollarlo e condividerlo.");
    const fail = () => alert("Non è stato possibile copiare automaticamente. Copia questo testo manualmente:\n\n" + jsonText);
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(jsonText).then(done).catch(fail);
    } else {
      try {
        const ta = document.createElement("textarea");
        ta.value = jsonText;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        done();
      } catch(e){ fail(); }
    }
  }

  if(navigator.share){
    try {
      await navigator.share({ title: cz.titolo, text: jsonText });
      return;
    } catch(err){
      // condivisione annullata o fallita: ripiega su copia negli appunti
    }
  }
  copyToClipboard();
}

function categoryCount(cat){
  return SONGS.filter(song => {
    if(cat.branca && !brancheOf(song).includes(cat.branca)) return false;

    if(cat.decade && ("" + Math.floor(song.anno / 10) * 10) !== cat.decade) return false;
    if(cat.genere && song.genere !== cat.genere) return false;
    if(cat.autore && song.autore !== cat.autore) return false;
    if(cat.tipo && song.tipo !== cat.tipo) return false;
    if(cat.origine && song.origine !== cat.origine) return false;

  }).length;
}

function categoryCount(cat){
  return SONGS.filter(song => {
    if(cat.branca && song.branca !== cat.branca) return false;
    if(cat.sede && !(song.sede || []).includes(cat.sede)) return false;
    if(cat.decade && ("" + Math.floor(song.anno / 10) * 10) !== cat.decade) return false;
    if(cat.genere && song.genere !== cat.genere) return false;
    if(cat.autore && song.autore !== cat.autore) return false;
    if(cat.tipo && song.tipo !== cat.tipo) return false;
    if(cat.origine && song.origine !== cat.origine) return false;
    return true;
  }).length;
}

function matchesCategory(song, cat){
  if(cat.isLuogoMeta) return false;
  if(cat.branca && !brancheOf(song).includes(cat.branca)) return false;
  if(cat.brancaTutte && !["L/C", "E/G", "R/S"].every(b => brancheOf(song).includes(b))) return false;
  if(cat.noAmbientazione && song.ambientazione) return false;
  if(cat.luogo && song.luogo !== cat.luogo) return false;
  if(cat.sede && !(song.sede || []).includes(cat.sede)) return false;
  if(cat.decade && ("" + Math.floor(song.anno / 10) * 10) !== cat.decade) return false;
  if(cat.annoMin != null && (song.anno == null || song.anno < cat.annoMin)) return false;
  if(cat.annoMax != null && (song.anno == null || song.anno > cat.annoMax)) return false;
  if(cat.genere && song.genere !== cat.genere) return false;
  if(cat.autore && song.autore !== cat.autore) return false;
  if(cat.tipo && song.tipo !== cat.tipo) return false;
  if(cat.origine && song.origine !== cat.origine) return false;
  if(cat.ambientazione && song.ambientazione !== cat.ambientazione) return false;
  if(cat.momento && !momentiOf(song).includes(cat.momento)) return false;
  if(cat.tempo && !tempiOf(song).includes(cat.tempo)) return false;
  return true;
}

function categoryCount(cat){
  return SONGS.filter(song => matchesCategory(song, cat)).length;
}

    if(!draggingRow) return;
    const delta = clientY - startY;
    draggingRow.style.transform = `translateY(${delta}px)`;

    const draggingRect = draggingRow.getBoundingClientRect();
    const draggingCenter = draggingRect.top + draggingRect.height / 2;

    getRows().forEach(row => {
      if(row === draggingRow) return;
      const rect = row.getBoundingClientRect();
      const rowCenter = rect.top + rect.height / 2;
      if(draggingCenter > rowCenter && draggingRow.nextElementSibling === row){
        container.insertBefore(draggingRow, row.nextSibling);
        draggingRow.style.transform = "none";
        startY = clientY;
      } else if(draggingCenter < rowCenter && draggingRow.previousElementSibling === row){
        container.insertBefore(draggingRow, row);
        draggingRow.style.transform = "none";
        startY = clientY;
      }
    });

    const margin = 60;
    if(clientY < margin){
      window.scrollBy(0, -8);
    } else if(clientY > window.innerHeight - margin){
      window.scrollBy(0, 8);
    }
  }

  function endDrag(){
    if(!draggingRow) return;
    const newOrder = getRows().map(row => row.dataset.id);
    CANZONIERI.sort((a, b) => newOrder.indexOf(a.id) - newOrder.indexOf(b.id));
    saveCanzonieri();
    draggingRow = null;
    activePointerId = null;
    renderCanzonieri();
  }

  function onPointerDown(e){
    if(e.pointerType === "mouse" && e.button !== 0) return;
    e.preventDefault();
    const handle = e.currentTarget;
    draggingRow = handle.closest(".cz-list-row");
    startY = e.clientY;
    activePointerId = e.pointerId;
    draggingRow.classList.add("cz-dragging");
    draggingRow.style.transition = "none";
    document.addEventListener("pointermove", onPointerMove);
    document.addEventListener("pointerup", onPointerUp);
    document.addEventListener("pointercancel", onPointerUp);
  }
  function onPointerMove(e){
    if(e.pointerId !== activePointerId) return;
    moveDrag(e.clientY);
  }
  function onPointerUp(e){
    if(e.pointerId !== activePointerId) return;
    document.removeEventListener("pointermove", onPointerMove);
    document.removeEventListener("pointerup", onPointerUp);
    document.removeEventListener("pointercancel", onPointerUp);
    endDrag();
  }

  getRows().forEach(row => {
    const handle = row.querySelector(".cz-drag-handle");
    if(!handle) return;
    handle.addEventListener("click", e => e.stopPropagation());
    handle.addEventListener("pointerdown", onPointerDown);
  });
}

function initCzDragReorder(container, cz){
  let draggingRow = null;
  let activePointerId = null;
  let startY = 0;

  function getRows(){
    return Array.from(container.querySelectorAll(".song-row"));
  }

  // Ogni riga "song-row" è sempre seguita nel DOM dalla propria riga "+" (cz-insert-row).
  // Queste funzioni saltano la riga "+" per trovare il vero vicino canzone/sezione.
  function nextSongRow(row){
    const insertRow = row.nextElementSibling;
    return insertRow ? insertRow.nextElementSibling : null;
  }
  function prevSongRow(row){
    const prevEl = row.previousElementSibling;
    return prevEl ? prevEl.previousElementSibling : null;
  }
  function moveUnitBefore(row, anchorNode){
    const insertRow = row.nextElementSibling;
    container.insertBefore(row, anchorNode);
    container.insertBefore(insertRow, anchorNode);
  }

  function moveDrag(clientY){
    if(!draggingRow) return;
    const delta = clientY - startY;
    draggingRow.style.transform = `translateY(${delta}px)`;

    const draggingRect = draggingRow.getBoundingClientRect();
    const draggingCenter = draggingRect.top + draggingRect.height / 2;

    getRows().forEach(row => {
      if(row === draggingRow) return;
      const rect = row.getBoundingClientRect();
      const rowCenter = rect.top + rect.height / 2;
      if(draggingCenter > rowCenter && nextSongRow(draggingRow) === row){
        moveUnitBefore(draggingRow, nextSongRow(row));
        draggingRow.style.transform = "none";
        startY = clientY;
      } else if(draggingCenter < rowCenter && prevSongRow(draggingRow) === row){
        moveUnitBefore(draggingRow, row);
        draggingRow.style.transform = "none";
        startY = clientY;
      }
    });

    const margin = 60;
    if(clientY < margin){
      window.scrollBy(0, -8);
    } else if(clientY > window.innerHeight - margin){
      window.scrollBy(0, 8);
    }
  }

  function endDrag(){
    if(!draggingRow) return;
    const rows = getRows();
    cz.canzoni = rows.map(row => row.dataset.key);
    cz.dataModifica = new Date().toISOString();
    saveCanzonieri();
    draggingRow = null;
    activePointerId = null;
    showCanzoniereDetail(cz.id);
  }

  function onPointerDown(e){
    if(e.pointerType === "mouse" && e.button !== 0) return;
    e.preventDefault();
    const handle = e.currentTarget;
    draggingRow = handle.closest(".song-row");
    startY = e.clientY;
    activePointerId = e.pointerId;
    draggingRow.classList.add("cz-dragging");
    draggingRow.style.transition = "none";
    document.addEventListener("pointermove", onPointerMove);
    document.addEventListener("pointerup", onPointerUp);
    document.addEventListener("pointercancel", onPointerUp);
  }
  function onPointerMove(e){
    if(e.pointerId !== activePointerId) return;
    moveDrag(e.clientY);
  }
  function onPointerUp(e){
    if(e.pointerId !== activePointerId) return;
    document.removeEventListener("pointermove", onPointerMove);
    document.removeEventListener("pointerup", onPointerUp);
    document.removeEventListener("pointercancel", onPointerUp);
    endDrag();
  }

  getRows().forEach(row => {
    const handle = row.querySelector(".cz-drag-handle");
    if(!handle) return;
    handle.addEventListener("click", e => e.stopPropagation());
    handle.addEventListener("pointerdown", onPointerDown);
  });
}

  renderHeaderBack(() => showCanzoniereDetail(id));

  backToTopBtn.classList.remove("visible");
  footer.textContent = "";
  content.innerHTML = "";
  window.scrollTo(0, 0);

  let query = "";
  let czSelectedTipi = new Set();
  let czSelectedBranche = new Set();
  let czSelectedSedi = new Set();
  let czSelectedOrigini = new Set();
  let czSelectedAmbientazioni = new Set();
  let czSelectedGeneri = new Set();
  let czSelectedMomenti = new Set();
  let czSelectedTempi = new Set();
  let czShowOnlyFavorites = false;
  let czFilterPanelOpen = false;
  let czSortMode = "alpha";
  let czSortDir = 1;

  const card = document.createElement("div");
  card.className = "card";
  content.appendChild(card);

  const searchFilterRow = document.createElement("div");
  searchFilterRow.className = "search-filter-row";
  searchFilterRow.style.top = (appHeader.offsetHeight + 12) + "px";

  const searchBox = document.createElement("div");
  searchBox.className = "search-box";
  searchBox.innerHTML = `
    ${ICONS.search(17)}
    <input type="text" id="czAddSearchInput" placeholder="Cerca titolo, luogo, branca, testo...">
    <button class="search-clear-btn" id="czAddSearchClear" aria-label="Cancella ricerca">${ICONS.clear(14)}</button>
  `;
  searchFilterRow.appendChild(searchBox);

  const brancheDisponibili = [...new Set(SONGS.flatMap(s => brancheOf(s)))].sort((a, b) => {
    const ORDINE_BRANCHE = ["L/C", "E/G", "R/S"];
    const ia = ORDINE_BRANCHE.indexOf(a), ib = ORDINE_BRANCHE.indexOf(b);
    if(ia === -1 && ib === -1) return a.localeCompare(b, "it");
    if(ia === -1) return 1;
    if(ib === -1) return -1;
    return ia - ib;
  });
  const sediDisponibili = [...new Set(SONGS.flatMap(s => s.sede || []))].sort();

  const filterBtn = document.createElement("button");
  filterBtn.className = "filter-toggle-btn";
  filterBtn.setAttribute("aria-label", "Filtra");
  filterBtn.innerHTML = ICONS.filter(17);
  searchFilterRow.appendChild(filterBtn);

  card.appendChild(searchFilterRow);

  const filterPanel = document.createElement("div");
  filterPanel.className = "filter-panel";

  function czMatchesFilters(song){
    const brancaOk = czSelectedBranche.size === 0 || song.tipo !== "scout" || brancheOf(song).some(b => czSelectedBranche.has(b));
    const sedeOk = czSelectedSedi.size === 0 || song.tipo !== "scout" || (song.sede || []).some(s => czSelectedSedi.has(s));
    const genereOk = czSelectedGeneri.size === 0 || czSelectedGeneri.has(song.genere);
    const momentoOk = czSelectedMomenti.size === 0 || momentiOf(song).some(m => czSelectedMomenti.has(m));
    const tempoOk = czSelectedTempi.size === 0 || tempiOf(song).some(t => czSelectedTempi.has(t));
    const tipoOk = czSelectedTipi.size === 0 || czSelectedTipi.has(song.tipo);
    const origineOk = czSelectedOrigini.size === 0 || song.tipo !== "scout" || czSelectedOrigini.has(song.origine);
    const ambientazioneOk = czSelectedAmbientazioni.size === 0 || czSelectedAmbientazioni.has(song.ambientazione);
    const favOk = !czShowOnlyFavorites || favoriti.has(favKey(song));
    return brancaOk && sedeOk && genereOk && momentoOk && tempoOk && tipoOk && origineOk && ambientazioneOk && favOk;
  }

  function czGroupSongs(list){
    const sorted = [...list].sort((a, b) => {
      if(czSortMode === "alpha"){
        return a.titolo.localeCompare(b.titolo, "it", { sensitivity: "base" }) * czSortDir;
      }
      return (a.anno - b.anno) * czSortDir;
    });
    const groups = [];
    let lastKey = null;
    sorted.forEach(song => {
      let key;
      if(czSortMode === "alpha"){
        const primaLettera = (song.titolo.trim()[0] || "#").toUpperCase();
        key = /[0-9]/.test(primaLettera) ? "1-9" : primaLettera;
      } else if(song.anno < 1900){
        key = String(Math.floor(song.anno / 100) * 100);
      } else {
        key = "Anni " + Math.floor(song.anno / 10) * 10;
      }
      if(key !== lastKey){
        groups.push({ key, songs: [] });
        lastKey = key;
      }
      groups[groups.length - 1].songs.push(song);
    });
    return groups;
  }

  function renderList(){
    const filtered = SONGS.filter(s => czMatchesFilters(s) && matchesSearch(s, query));
    results.innerHTML = "";
    if(filtered.length === 0){
      results.innerHTML = `<div class="empty">Nessuna canzone trovata${query ? ` per "${query}"` : ""}.</div>`;
      return;
    }
    czGroupSongs(filtered).forEach(group => {
      const divider = document.createElement("div");
      divider.className = "group-divider";
      divider.textContent = group.key;
      results.appendChild(divider);

      group.songs.forEach(song => {
        const key = favKey(song);
        const selected = cz.canzoni.includes(key);
        const row = document.createElement("div");
        row.className = "song-row";
        row.innerHTML = `
          <div style="flex:1; min-width:0;">
            <div class="row-title">${song.titolo}</div>
            <div class="row-meta">${metaLine(song)}</div>
          </div>
          <div class="row-end">
            <button class="cz-toggle-btn" style="border:none;background:none;padding:6px;margin:-6px;display:flex;align-items:center;cursor:pointer;flex-shrink:0;color:${selected ? "var(--purple)" : "#D8D6DE"};" aria-label="${selected ? "Rimuovi" : "Aggiungi"}">${selected ? ICONS.checkCircle(22) : ICONS.plusCircle(22)}</button>
          </div>
        `;
        row.addEventListener("click", () => {
          if(selected){
            cz.canzoni = cz.canzoni.filter(k => k !== key);
          } else {
            cz.canzoni.push(key);
          }
          cz.dataModifica = new Date().toISOString();
          saveCanzonieri();
          renderList();
        });
        results.appendChild(row);
      });
    });
  }

  function buildFilterRow(label, values, selectedSet, onToggle){
    if(values.length < 2) return null;
    const row = document.createElement("div");
    row.className = "filter-row";
    const chipsHtml = values.map(v =>
      `<button class="filter-chip ${selectedSet.has(v) ? "active" : ""}" data-value="${v}">${v}</button>`
    ).join("");
    row.innerHTML = `<div class="filter-label">${label}</div><div class="filter-chips">${chipsHtml}</div>`;
    row.querySelectorAll(".filter-chip").forEach(chip => {
      chip.addEventListener("click", () => {
        const v = chip.dataset.value;
        const wasSelected = selectedSet.has(v);
        if(wasSelected) selectedSet.delete(v); else selectedSet.add(v);
        if(onToggle) onToggle(v, !wasSelected);
        rebuildFilterPanel();
        updateFilterBtnState();
        renderList();
      });
    });
    return row;
  }

  function rebuildFilterPanel(){
    if(!(czSelectedBranche.has("L/C") && czSelectedOrigini.has("AGESCI"))){
      czSelectedAmbientazioni.clear();
    }
    filterPanel.innerHTML = "";

    const tipiLabel = { scout: "Scout", messa: "Messa", musica: "Brani famosi" };
    const tipiDisponibili = ["scout", "messa", "musica"].filter(t => SONGS.some(s => s.tipo === t));
    const quickRow = document.createElement("div");
    quickRow.className = "filter-row";
    const favChipHtml = `<button class="filter-chip fav-chip ${czShowOnlyFavorites ? "active" : ""}">${ICONS.star(13, true)} Preferiti</button>`;
    const tipoChipsHtml = tipiDisponibili.map(v =>
      `<button class="filter-chip ${czSelectedTipi.has(v) ? "active" : ""}" data-value="${v}">${tipiLabel[v] || v}</button>`
    ).join("");
    quickRow.innerHTML = `<div class="filter-chips">${tipoChipsHtml}${favChipHtml}</div>`;
    quickRow.querySelector(".fav-chip").addEventListener("click", () => {
      czShowOnlyFavorites = !czShowOnlyFavorites;
      rebuildFilterPanel();
      updateFilterBtnState();
      renderList();
    });
    quickRow.querySelectorAll(".filter-chip[data-value]").forEach(chip => {
      chip.addEventListener("click", () => {
        const v = chip.dataset.value;
        const wasSelected = czSelectedTipi.has(v);
        if(wasSelected){
          czSelectedTipi.delete(v);
          if(v === "scout"){ czSelectedBranche.clear(); czSelectedOrigini.clear(); czSelectedSedi.clear(); }
          if(v === "messa"){ czSelectedMomenti.clear(); czSelectedTempi.clear(); }
          if(v === "musica"){ czSelectedGeneri.clear(); }
        } else {
          czSelectedTipi.clear();
          czSelectedTipi.add(v);
          if(v !== "scout"){ czSelectedBranche.clear(); czSelectedOrigini.clear(); czSelectedSedi.clear(); }
          if(v !== "messa"){ czSelectedMomenti.clear(); czSelectedTempi.clear(); }
          if(v !== "musica"){ czSelectedGeneri.clear(); }
        }
        rebuildFilterPanel();
        updateFilterBtnState();
        renderList();
      });
    });
    filterPanel.appendChild(quickRow);

    const scoutSelezionato = czSelectedTipi.has("scout");
    const origineVuoto = czSelectedOrigini.size === 0;

    if(scoutSelezionato){
      const brancaRow = buildFilterRow("Branca", brancheDisponibili, czSelectedBranche, (v, isActive) => {
        if(isActive) czSelectedTipi.add("scout");
      });
      if(brancaRow) filterPanel.appendChild(brancaRow);

      const origineDisponibili = [...new Set(SONGS.filter(s => s.tipo === "scout").map(s => s.origine).filter(Boolean))];
      const origineRow = buildFilterRow("Origine", origineDisponibili, czSelectedOrigini);
      if(origineRow) filterPanel.appendChild(origineRow);

      if(origineVuoto || czSelectedOrigini.has("Roma 150")){
        const sedeRow = buildFilterRow("Sede", sediDisponibili, czSelectedSedi, (v, isActive) => {
          if(isActive){ czSelectedTipi.add("scout"); czSelectedOrigini.add("Roma 150"); }
        });
        if(sedeRow) filterPanel.appendChild(sedeRow);
      }
      if(czSelectedBranche.has("L/C") && czSelectedOrigini.has("AGESCI")){
        const ambientazioneRow = buildFilterRow("Ambiente fantastico", ["Bosco", "Giungla"], czSelectedAmbientazioni);
        if(ambientazioneRow) filterPanel.appendChild(ambientazioneRow);
      }
    }
    if(czSelectedTipi.has("musica")){
      const genereDisponibili = [...new Set(SONGS.filter(s => s.tipo === "musica").map(s => s.genere).filter(Boolean))].sort();
      const genereRow = buildFilterRow("Genere", genereDisponibili, czSelectedGeneri);
      if(genereRow) filterPanel.appendChild(genereRow);
    }
    if(czSelectedTipi.has("messa")){
      const ORDINE_MOMENTI = ["Ingresso", "Gloria", "Alleluia", "Offertorio", "Santo", "Comunione", "Pace", "Finale"];
      const ORDINE_TEMPI = ["Avvento", "Natale", "Quaresima", "Pasqua", "Tempo Ordinario", "Pentecoste"];
      const ORDINE_SACRAMENTI = ["Funerale", "Matrimonio", "Battesimo", "Comunione", "Cresima"];
      const momentoDisponibili = [...new Set(SONGS.filter(s => s.tipo === "messa").flatMap(s => momentiOf(s)))]
        .sort((a, b) => ORDINE_MOMENTI.indexOf(a) - ORDINE_MOMENTI.indexOf(b));
      const momentoRow = buildFilterRow("Momento liturgico", momentoDisponibili, czSelectedMomenti);
      if(momentoRow) filterPanel.appendChild(momentoRow);

      const tuttiTempi = [...new Set(SONGS.filter(s => s.tipo === "messa").flatMap(s => tempiOf(s)))];
      const tempoDisponibili = tuttiTempi.filter(v => ORDINE_TEMPI.includes(v)).sort((a, b) => ORDINE_TEMPI.indexOf(a) - ORDINE_TEMPI.indexOf(b));
      const tempoRow = buildFilterRow("Tempo liturgico", tempoDisponibili, czSelectedTempi);
      if(tempoRow) filterPanel.appendChild(tempoRow);

      const sacramentiDisponibili = tuttiTempi.filter(v => ORDINE_SACRAMENTI.includes(v)).sort((a, b) => ORDINE_SACRAMENTI.indexOf(a) - ORDINE_SACRAMENTI.indexOf(b));
      const sacramentiRow = buildFilterRow("Sacramenti e cerimonie", sacramentiDisponibili, czSelectedTempi);
      if(sacramentiRow) filterPanel.appendChild(sacramentiRow);
    }
  }

  rebuildFilterPanel();
  filterPanel.classList.toggle("open", czFilterPanelOpen);
  card.appendChild(filterPanel);

  filterBtn.addEventListener("click", () => {
    czFilterPanelOpen = filterPanel.classList.toggle("open");
  });

  function updateFilterBtnState(){
    const anyActive = czSelectedBranche.size > 0 || czSelectedSedi.size > 0 || czSelectedTipi.size > 0 || czSelectedOrigini.size > 0 || czSelectedAmbientazioni.size > 0 || czSelectedGeneri.size > 0 || czSelectedMomenti.size > 0 || czSelectedTempi.size > 0 || czShowOnlyFavorites;
    filterBtn.classList.toggle("active", anyActive);
  }
  updateFilterBtnState();

  const sortRow = document.createElement("div");
  sortRow.className = "sort-row";
  sortRow.innerHTML = `
    <div class="segmented">
      <button id="czSortAlpha" class="active">A-Z</button>
      <button id="czSortAnno">Anno</button>
    </div>
    <button class="dir-btn" id="czDirToggle" aria-label="Inverti ordine">
      ${ICONS.sortAsc(17)}
    </button>
  `;
  card.appendChild(sortRow);

  sortRow.querySelector("#czSortAlpha").addEventListener("click", () => {
    czSortMode = "alpha";
    sortRow.querySelector("#czSortAlpha").classList.add("active");
    sortRow.querySelector("#czSortAnno").classList.remove("active");
    renderList();
  });
  sortRow.querySelector("#czSortAnno").addEventListener("click", () => {
    czSortMode = "anno";
    sortRow.querySelector("#czSortAnno").classList.add("active");
    sortRow.querySelector("#czSortAlpha").classList.remove("active");
    renderList();
  });
  sortRow.querySelector("#czDirToggle").addEventListener("click", () => {
    czSortDir *= -1;
    sortRow.querySelector("#czDirToggle").innerHTML = czSortDir === 1 ? ICONS.sortAsc(17) : ICONS.sortDesc(17);
    renderList();
  });

  const results = document.createElement("div");
  results.id = "czAddResultsArea";
  card.appendChild(results);

  renderList();

  const searchInput = searchBox.querySelector("#czAddSearchInput");
  const searchClear = searchBox.querySelector("#czAddSearchClear");
  searchInput.addEventListener("input", () => {
    query = searchInput.value;
    searchClear.classList.toggle("visible", !!query);
    renderList();
  });
  searchClear.addEventListener("click", () => {
    query = "";
    searchInput.value = "";
    searchClear.classList.remove("visible");
    renderList();
    searchInput.focus();
  });
}

function openCzInsertSongPicker(cz, insertIndex){
  const overlay = document.createElement("div");
  overlay.className = "cz-picker-overlay";
  overlay.innerHTML = `
    <div class="cz-picker-panel">
      <div class="cz-picker-header">
        <div class="list-title" style="margin:0;">Aggiungi canzone</div>
        <button class="cz-picker-close" aria-label="Chiudi">${ICONS.clear(14)}</button>
      </div>
      <div class="search-box" style="margin:10px 0;">
        ${ICONS.search(17)}
        <input type="text" id="czPickerSearch" placeholder="Cerca titolo...">
      </div>
      <div class="cz-picker-results" id="czPickerResults"></div>
    </div>
  `;
  document.querySelector(".phone").appendChild(overlay);

  const resultsEl = overlay.querySelector("#czPickerResults");
  const searchInput = overlay.querySelector("#czPickerSearch");

  function closeOverlay(){
    overlay.remove();
  }

  function renderPickerResults(query){
    const filtered = SONGS.filter(s => matchesSearch(s, query))
      .sort((a, b) => a.titolo.localeCompare(b.titolo, "it", { sensitivity: "base" }));
    resultsEl.innerHTML = "";
    if(filtered.length === 0){
      resultsEl.innerHTML = `<div class="empty">Nessuna canzone trovata${query ? ` per "${query}"` : ""}.</div>`;
      return;
    }
    filtered.forEach(song => {
      const row = document.createElement("div");
      row.className = "song-row";
      row.innerHTML = `
        <div style="flex:1; min-width:0;">
          <div class="row-title">${song.titolo}</div>
          <div class="row-meta">${metaLine(song)}</div>
        </div>
      `;
      row.addEventListener("click", () => {
        cz.canzoni.splice(insertIndex, 0, favKey(song));
        cz.dataModifica = new Date().toISOString();
        saveCanzonieri();
        closeOverlay();
        showCanzoniereDetail(cz.id);
      });
      resultsEl.appendChild(row);
    });
  }
  renderPickerResults("");
  searchInput.addEventListener("input", () => renderPickerResults(searchInput.value));

  overlay.querySelector(".cz-picker-close").addEventListener("click", closeOverlay);
  overlay.addEventListener("click", (e) => { if(e.target === overlay) closeOverlay(); });
}

function promptAddSectionAt(cz, insertIndex){
  const titolo = prompt("Titolo della sezione:");
  if(titolo && titolo.trim()){
    cz.canzoni.splice(insertIndex, 0, CZ_SECTION_PREFIX + titolo.trim());
    cz.dataModifica = new Date().toISOString();
    saveCanzonieri();
    showCanzoniereDetail(cz.id);
  }
}

function runCzInsertOption(cz, insertIndex, opt){
  if(opt.action === "song"){ openCzInsertSongPicker(cz, insertIndex); return; }
  if(opt.action === "sezione"){ promptAddSectionAt(cz, insertIndex); return; }
  openCzTypedItemForm(cz, opt.itemType, insertIndex, null);
}

function openCzInsertMenu(cz, insertIndex, options){
  const overlay = document.createElement("div");
  overlay.className = "cz-picker-overlay";
  overlay.innerHTML = `
    <div class="cz-picker-panel">
      <div class="cz-picker-header">
        <div class="list-title" style="margin:0;">Aggiungi</div>
        <button class="cz-picker-close" aria-label="Chiudi">${ICONS.clear(14)}</button>
      </div>
      <div class="cz-picker-results" id="czInsertMenuList"></div>

  `;
  document.querySelector(".phone").appendChild(overlay);

  const listEl = overlay.querySelector("#czInsertMenuList");

    const row = document.createElement("div");
    row.className = "song-row";
    row.innerHTML = `
      <div class="cz-type-icon" style="color:${opt.color || "var(--purple)"}; background:${opt.color ? opt.color + "22" : "var(--lilac)"}">${opt.icon(18)}</div>
      <div class="row-title" style="margin-left:10px;">${opt.label}</div>

}

// Form di creazione/modifica per una voce tipizzata (titolo + testo facoltativo).
// existingKey null => crea nuova voce in insertIndex; existingKey valorizzata => modifica quella voce.
function openCzTypedItemForm(cz, itemType, insertIndex, existingKey){
  const isEdit = !!existingKey;
  let initialTitolo = "", initialTesto = "";
  if(isEdit){
    const parsed = parseTypedItemBody(existingKey, itemType);
    initialTitolo = parsed.titolo;
    initialTesto = parsed.testo;
  }

  const overlay = document.createElement("div");
  overlay.className = "cz-picker-overlay";
  overlay.innerHTML = `
    <div class="cz-picker-panel">
      <div class="cz-picker-header">
        <div class="list-title" style="margin:0;">${isEdit ? "Modifica" : "Aggiungi"} ${itemType.label}</div>
        <button class="cz-picker-close" aria-label="Chiudi">${ICONS.clear(14)}</button>
      </div>
      <div class="filter-row" style="margin-top:10px;">
        <div class="filter-label">Titolo</div>
        <input type="text" class="form-input" id="czTypedTitolo" placeholder="Titolo" value="${initialTitolo.replace(/"/g, "&quot;")}">
      </div>
      <div class="filter-row">
        <div class="filter-label">Testo (facoltativo)</div>
        <textarea class="form-textarea" id="czTypedTesto" placeholder="Testo da leggere...">${initialTesto}</textarea>
      </div>
    </div>
  `;
  document.querySelector(".phone").appendChild(overlay);

  function closeOverlay(){ overlay.remove(); }

  const saveBtn = document.createElement("button");
  saveBtn.className = "pill-btn active";
  saveBtn.style.width = "100%";
  saveBtn.style.justifyContent = "center";
  saveBtn.style.marginTop = "10px";
  saveBtn.textContent = "Salva";
  saveBtn.addEventListener("click", () => {
    const titolo = overlay.querySelector("#czTypedTitolo").value.trim();
    const testo = overlay.querySelector("#czTypedTesto").value;
    if(!titolo) return;
    const newKey = buildTypedItemKey(itemType, titolo, testo);
    if(isEdit){
      const i = cz.canzoni.indexOf(existingKey);
      if(i !== -1) cz.canzoni[i] = newKey;
    } else {
      cz.canzoni.splice(insertIndex, 0, newKey);
    }
    cz.dataModifica = new Date().toISOString();
    saveCanzonieri();
    closeOverlay();
    showCanzoniereDetail(cz.id);
  });
  overlay.querySelector(".cz-picker-panel").appendChild(saveBtn);

  overlay.querySelector(".cz-picker-close").addEventListener("click", closeOverlay);
  overlay.addEventListener("click", (e) => { if(e.target === overlay) closeOverlay(); });
}

// Dettaglio a comparsa di una voce tipizzata: mostra testo intero, con Modifica/Elimina se non è predefinita.
function openCzTypedItemDetail(cz, key, itemType, isPreset){
  const { titolo, testo } = parseTypedItemBody(key, itemType);

  const overlay = document.createElement("div");
  overlay.className = "cz-picker-overlay";
  overlay.innerHTML = `
    <div class="cz-picker-panel">
      <div class="cz-picker-header">
        <div style="display:flex; align-items:center; gap:8px; min-width:0;">
          <div class="cz-type-icon" style="color:${itemType.color}; background:${itemType.color}22; flex-shrink:0;">${itemType.icon(16)}</div>
          <div class="list-title" style="margin:0;">${titolo}</div>
        </div>
        <button class="cz-picker-close" aria-label="Chiudi">${ICONS.clear(14)}</button>
      </div>
      <p class="row-meta" style="margin:6px 0 10px;">${itemType.label}</p>
      ${testo ? `<div class="cz-typed-detail-text">${testo.replace(/</g, "&lt;")}</div>` : `<p class="empty">Nessun testo inserito.</p>`}
    </div>
  `;
  document.querySelector(".phone").appendChild(overlay);

  function closeOverlay(){ overlay.remove(); }

  if(!isPreset){
    const actionsRow = document.createElement("div");
    actionsRow.style.display = "flex";
    actionsRow.style.gap = "8px";
    actionsRow.style.marginTop = "12px";

    const editBtn = document.createElement("button");
    editBtn.className = "pill-btn active";
    editBtn.style.flex = "1";
    editBtn.style.justifyContent = "center";
    editBtn.textContent = "Modifica";
    editBtn.addEventListener("click", () => {
      closeOverlay();
      openCzTypedItemForm(cz, itemType, null, key);
    });
    actionsRow.appendChild(editBtn);

    const deleteBtn = document.createElement("button");
    deleteBtn.className = "pill-btn active";
    deleteBtn.style.flex = "1";
    deleteBtn.style.justifyContent = "center";
    deleteBtn.style.background = "#B3261E";
    deleteBtn.textContent = "Elimina";
    deleteBtn.addEventListener("click", () => {
      cz.canzoni = cz.canzoni.filter(k => k !== key);
      cz.dataModifica = new Date().toISOString();
      saveCanzonieri();
      closeOverlay();
      showCanzoniereDetail(cz.id);
    });
    actionsRow.appendChild(deleteBtn);

    overlay.querySelector(".cz-picker-panel").appendChild(actionsRow);
  }

  overlay.querySelector(".cz-picker-close").addEventListener("click", closeOverlay);
  overlay.addEventListener("click", (e) => { if(e.target === overlay) closeOverlay(); });
}

        <button class="cz-edit-btn" aria-label="Modifica canzoniere" style="border:none; background:none; padding:0; cursor:pointer; display:flex; align-items:center; flex-shrink:0; align-self:center;">${ICONS.edit(18)}</button>

// Effetto lente/magnete al tocco prolungato, stile Dock
(function initMagnifierNav(){
  const bottoni = Array.from(bottomNav.querySelectorAll(".nav-item"));
  let pressando = false;

  function trovaBottonePiuVicino(clientX){
    let btnPiuVicino = null, distanzaMinima = Infinity;
    bottoni.forEach(btn => {
      const rect = btn.getBoundingClientRect();
      const centro = rect.left + rect.width / 2;
      const distanza = Math.abs(clientX - centro);
      if(distanza < distanzaMinima){ distanzaMinima = distanza; btnPiuVicino = btn; }
    });
    return btnPiuVicino;
  }

  function aggiornaMagnificazione(clientX){
    bottoni.forEach(btn => {
      const rect = btn.getBoundingClientRect();
      const centro = rect.left + rect.width / 2;
      const distanza = Math.abs(clientX - centro);
      const raggio = 90;
      const scala = distanza < raggio ? 1 + (1 - distanza / raggio) * 0.525 : 1;
      const pill = btn.querySelector(".nav-pill");
      if(pill) pill.style.transform = "scale(" + scala.toFixed(3) + ")";
    });
  }

  function resetMagnificazione(){
    bottoni.forEach(btn => {
      const pill = btn.querySelector(".nav-pill");
      if(pill) pill.style.transform = "";
    });
  }

  function aggiornaAnteprimaSelezione(clientX){
    const vicino = trovaBottonePiuVicino(clientX);
    bottoni.forEach(btn => btn.classList.toggle("drag-preview", btn === vicino));
  }

  function pulisciAnteprimaSelezione(){
    bottoni.forEach(btn => btn.classList.remove("drag-preview"));
  }

  bottomNav.addEventListener("touchstart", (e) => {
    pressando = true;
    bottomNav.classList.add("dragging");
    aggiornaMagnificazione(e.touches[0].clientX);
    aggiornaAnteprimaSelezione(e.touches[0].clientX);
  }, { passive: true });

  bottomNav.addEventListener("touchmove", (e) => {
    if(!pressando) return;
    aggiornaMagnificazione(e.touches[0].clientX);
    aggiornaAnteprimaSelezione(e.touches[0].clientX);
  }, { passive: true });

  bottomNav.addEventListener("touchend", (e) => {
    if(!pressando) return;
    pressando = false;
    bottomNav.classList.remove("dragging");
    const ultimoTouch = e.changedTouches[0];
    const btnPiuVicino = trovaBottonePiuVicino(ultimoTouch.clientX);
    if(btnPiuVicino) showTab(btnPiuVicino.dataset.tab);
    resetMagnificazione();
    pulisciAnteprimaSelezione();
  });

  bottomNav.addEventListener("touchcancel", () => {
    pressando = false;
    bottomNav.classList.remove("dragging");
    resetMagnificazione();
    pulisciAnteprimaSelezione();
  });
})();

  "lupetto": "l/c",

  "coccinella": "l/c",
  "coccinelle": "l/c",

function normalizeText(str){
  return String(str || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase();
}

function matchesSearch(song, query){
  if(!query.trim()) return true;
  const plainLyrics = (song.testo_accordi || "").replace(/\[[^\]]+\]/g, "");
  const sede = (song.sede || []).join(" ");
  const haystack = normalizeText([
    song.titolo || "",
    String(song.anno || ""),
    song.luogo || "",
    brancheOf(song).join(" "),
    sede,    song.tonalita || "",
    song.autore || "",
    song.genere || "",
    song.tipo || "",
    momentiOf(song).join(" "),
    tempiOf(song).join(" "),
    song.ambientazione || "",
    plainLyrics
  ].join(" "));

  const tokens = normalizeText(query).split(/\s+/).filter(Boolean);
  return tokens.every(token => haystack.includes(token) || (SEARCH_ALIASES[token] && haystack.includes(SEARCH_ALIASES[token])));
}

function groupSongs(list){
  const sorted = [...list].sort((a, b) => {
    if(sortMode === "alpha"){
      return a.titolo.localeCompare(b.titolo, "it", { sensitivity: "base" }) * sortDir;
    }
    return (a.anno - b.anno) * sortDir;
  });

  const groups = [];
  let lastKey = null;
  sorted.forEach(song => {
    let key;
    if(sortMode === "alpha"){
      const primaLettera = (song.titolo.trim()[0] || "#").toUpperCase();
      key = /[0-9]/.test(primaLettera) ? "1-9" : primaLettera;
    } else if(song.anno < 1900){
      const century = Math.floor(song.anno / 100) * 100;
      key = String(century);
    } else {
      const decade = Math.floor(song.anno / 10) * 10;
      key = "Anni " + decade;
    }
    if(key !== lastKey){
      groups.push({ key, songs: [] });
      lastKey = key;
    }
    groups[groups.length - 1].songs.push(song);
  });
  return groups;
}

function wireUpdateBtnEl(btn){
  if(!btn) return;
  btn.classList.add("update-check-btn");
  btn.classList.toggle("offline", !navigator.onLine);
  btn.classList.toggle("has-update", updateAvailable);
  btn.addEventListener("click", async () => {
    if(!navigator.onLine || btn.classList.contains("updating")) return;
    btn.classList.add("updating");
    try{
      if("serviceWorker" in navigator){
        const reg = await navigator.serviceWorker.getRegistration();
        if(reg && reg.active){
          reg.active.postMessage("CLEAR_APP_SHELL_CACHE");
        }
        if(reg) await reg.update();
      }
    } catch(e){ /* proseguo comunque con il ricaricamento */ }
    setTimeout(() => window.location.reload(), 400);
  });
}

function annoLabel(song){
  if(song.anno == null) return "";
  if(song.anno_incerto){
    const decade = Math.floor(song.anno / 10) * 10;
    if(decade >= 1930){
      return "Anni '" + String(decade).slice(-2);
    }
    if(decade >= 1900){
      return "Anni '" + String(decade).slice(-3);
    }
    const century = Math.floor(song.anno / 100) * 100;
    return "Anni '" + String(century).slice(-3);
  }
  return String(song.anno);
}

function metaLine(song){
  let parts;
  if(song.tipo === "musica"){
    parts = [annoLabel(song), song.autore, song.genere];
  } else if(song.tipo === "messa"){
    parts = [annoLabel(song), momentiOf(song).join(" - "), tempiOf(song).join(" - ")];  } else {
    parts = [annoLabel(song), song.luogo, brancheOf(song).join(" / "), song.ambientazione];
    if(song.sede && song.sede.length) parts.push(song.sede.join(", "));
  }
  return parts.filter(Boolean).join(" · ");
}

function matchesFilters(song){
  const brancaOk = selectedBranche.size === 0 || song.tipo !== "scout" || brancheOf(song).some(b => selectedBranche.has(b));
  const sedeOk = selectedSedi.size === 0 || song.tipo !== "scout" || (song.sede || []).some(s => selectedSedi.has(s));
  const decadeOk = selectedDecadi.size === 0 || selectedDecadi.has("" + Math.floor(song.anno / 10) * 10);
  const genereOk = selectedGeneri.size === 0 || selectedGeneri.has(song.genere);
  const autoreOk = selectedAutori.size === 0 || selectedAutori.has(song.autore);
  const momentoOk = selectedMomenti.size === 0 || momentiOf(song).some(m => selectedMomenti.has(m));
  const tempoOk = selectedTempi.size === 0 || tempiOf(song).some(t => selectedTempi.has(t));
  const tipoOk = selectedTipi.size === 0 || selectedTipi.has(song.tipo);
  const origineOk = selectedOrigini.size === 0 || song.tipo !== "scout" || selectedOrigini.has(song.origine);
  const ambientazioneOk = selectedAmbientazioni.size === 0 || selectedAmbientazioni.has(song.ambientazione);
  const favOk = !showOnlyFavorites || favoriti.has(favKey(song));
  return brancaOk && sedeOk && decadeOk && genereOk && autoreOk && momentoOk && tempoOk && tipoOk && origineOk && ambientazioneOk && favOk;}

function renderResults(card){
  let results = card.querySelector("#resultsArea");
  results.innerHTML = "";

  const filtered = SONGS.filter(song => matchesFilters(song) && matchesSearch(song, searchQuery));

  if(filtered.length === 0){
    results.innerHTML = `<div class="empty">Nessuna canzone trovata${searchQuery ? ` per "${searchQuery}"` : ""}.</div>`;
    return;

  groupSongs(filtered).forEach(group => {
    const divider = document.createElement("div");
    divider.className = "group-divider";
    divider.textContent = group.key;

    group.songs.forEach(song => {

    });
  });
}
